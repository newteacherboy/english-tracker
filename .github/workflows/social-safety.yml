name: Social safety and guardian controls
on:
  push:
    paths: ['ingilizce/social-safety.*', 'ingilizce/veli-kontrolu.html', 'ingilizce/bottom-nav.js', 'ingilizce/medupro.js', 'supabase/functions/**/social-safety.mjs', 'supabase/functions/diji-api/index.ts', 'supabase/functions/medupro-api/index.ts', 'supabase/migrations/*social_safety*', 'tests/social-safety*', '.github/workflows/social-safety.yml']
  pull_request:
    paths: ['ingilizce/social-safety.*', 'ingilizce/veli-kontrolu.html', 'supabase/functions/**/social-safety.mjs', 'tests/social-safety*']
concurrency:
  group: social-safety-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - run: node --test tests/social-safety.test.mjs tests/social-safety-ui.test.cjs tests/medupro-edge.test.cjs tests/medupro-presence.test.cjs tests/progression-api.test.cjs tests/portal-integrity.test.cjs tests/account-deletion-sw.test.cjs
