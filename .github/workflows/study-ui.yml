name: Study interface
on:
  push:
    paths: ['ingilizce/study-ui.*', 'ingilizce/study-assets/**', 'ingilizce/ders-test.*', 'ingilizce/ders-vadi.*', 'tests/study-ui.cjs', '.github/workflows/study-ui.yml']
  pull_request:
    paths: ['ingilizce/study-ui.*', 'ingilizce/study-assets/**', 'ingilizce/ders-test.*', 'ingilizce/ders-vadi.*', 'tests/study-ui.cjs', '.github/workflows/study-ui.yml']
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/study-ui.cjs
