name: Member flow regression checks
on:
  push:
    paths: ['ingilizce/**', 'supabase/functions/diji-api/member-tools-api.ts', 'supabase/functions/medupro-api/**', 'tests/member-fixes-ui.cjs', 'tests/classroom-authorization.test.cjs', '.github/workflows/member-fixes.yml']
  pull_request:
    paths: ['ingilizce/**', 'supabase/functions/diji-api/member-tools-api.ts', 'supabase/functions/medupro-api/**', 'tests/member-fixes-ui.cjs', 'tests/classroom-authorization.test.cjs']
permissions:
  contents: read
jobs:
  member-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
      - run: node --test tests/member-fixes-ui.cjs tests/member-tools.test.cjs tests/classroom-authorization.test.cjs tests/app-updates.test.cjs tests/portal-integrity.test.cjs tests/account-deletion-sw.test.cjs tests/sw-versioned-cache.test.cjs
      - run: node tests/world-badges-ui.cjs
      - run: node tests/medupro-edge.test.cjs
