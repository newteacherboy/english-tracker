name: Diji Medu Android release (AAB)
# Elle çalıştırılır. Play yükleme anahtarıyla imzalı AAB üretir; Play Console'a elle yüklenir (önce dahili test).
# Gerekli repo gizli değerleri:
#   ANDROID_KEYSTORE_BASE64  (signing.keystore dosyasının base64 hâli)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  (signing-key-info.txt içindeki değerler)
on:
  # Dal birleşmeden de çalışabilsin: release/android-* veya claude/android-release-* dalına push edince başlar.
  push:
    branches: ['release/android-*', 'claude/android-release-*']
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Play sürüm kodu (son yüklenenden büyük olmalı)'
        required: true
        default: '6'
      version_name:
        description: 'Sürüm adı'
        required: true
        default: '1.2.2'
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: node --test ../supabase/functions/billing/play.test.mjs
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Bundle web assets with live AdMob units
        env:
          DM_PRODUCTION_ADS: '1'
        run: npm run sync
      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.event.inputs.version_code || '6' }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.version_name || '1.2.2' }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon bundleRelease
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: DijiMedu-${{ github.event.inputs.version_name || '1.2.2' }}-${{ github.event.inputs.version_code || '6' }}-AAB
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
