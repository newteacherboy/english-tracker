name: Thematic learning 240 lessons
on:
  push:
    paths: ['ingilizce/thematic-*', 'ingilizce/learning-*', 'supabase/functions/thematic-learning/**', 'tests/thematic-learning*', 'tests/thematic-grouped-teach*', 'tests/thematic-mint*', 'tests/school-shared*', 'tests/activity-notices*', 'tests/final-review-retry*', 'ingilizce/school-*', 'ingilizce/papi-flow.js', 'ingilizce/verified-games.js', 'content/thematic-*', 'scripts/*thematic*', '.github/workflows/thematic-learning.yml']
  pull_request:
    paths: ['ingilizce/thematic-*', 'ingilizce/learning-*', 'supabase/functions/thematic-learning/**', 'tests/thematic-learning*', 'tests/thematic-grouped-teach*', 'tests/thematic-mint*']
permissions:
  contents: read
jobs:
  thematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/build-thematic-learning.py
      - run: git diff --exit-code -- ingilizce/thematic-curriculum.json supabase/functions/thematic-learning/curriculum.json
      - run: node --check ingilizce/thematic-learning.js && node --test tests/thematic-learning.test.cjs tests/thematic-learning-mascots.test.cjs tests/portal-integrity.test.cjs tests/story-api.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2 jsdom@26.1.0
      - run: node --test tests/thematic-grouped-teach.test.cjs tests/school-shared-curriculum.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/thematic-learning-ui.cjs
      - run: node tests/thematic-mint-ui.cjs
      - run: node tests/school-shared-ui.cjs
      - run: node tests/activity-notices-ui.cjs
      - run: node tests/final-review-retry-ui.cjs
      - run: python scripts/check-media-rights.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thematic-learning-mobile
          path: |
            /tmp/thematic-learning-qa/*.png
            /tmp/thematic-mint-qa/*.png
            /tmp/school-shared-qa/*.png
