name: Thematic learning 240 lessons
on:
  push:
    paths: ['ingilizce/thematic-*', 'ingilizce/learning-*', 'supabase/functions/thematic-learning/**', 'tests/thematic-learning*', 'content/thematic-*', 'scripts/*thematic*', '.github/workflows/thematic-learning.yml']
  pull_request:
    paths: ['ingilizce/thematic-*', 'ingilizce/learning-*', 'supabase/functions/thematic-learning/**', 'tests/thematic-learning*']
permissions:
  contents: read
jobs:
  thematic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/build-thematic-learning.py
      - run: git diff --exit-code -- ingilizce/thematic-curriculum.json supabase/functions/thematic-learning/curriculum.json
      - run: node --check ingilizce/thematic-learning.js && node --test tests/thematic-learning.test.cjs tests/portal-integrity.test.cjs tests/story-api.test.cjs
      - run: python scripts/check-media-rights.py
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/thematic-learning-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thematic-learning-mobile
          path: /tmp/thematic-learning-qa/*.png
