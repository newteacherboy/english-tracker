name: Papi V2 safety tests
on:
  push:
    branches: [feature/papi-learning-v2-80]
  pull_request:
    paths:
      - 'scripts/papi-v2-*'
      - 'tests/papi-v2-*'
      - 'ingilizce/papi-v2-*'
      - 'docs/papi-v2-*'
      - 'supabase/functions/diji-api/story-*'
      - '.github/workflows/papi-v2-tests.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Papi V2 standalone tests
        run: |
          node --test scripts/papi-v2-question-helpers.test.mjs
          node --test scripts/papi-v2-activity-engine.test.mjs
          node --test scripts/papi-v2-content.test.mjs
          node --test tests/papi-v2-route.test.mjs
          node --test tests/papi-v2-server-order.test.mjs
          node --test tests/papi-v2-curated-content.test.mjs
      - name: Check existing story regression tests
        run: node --test tests/story-api.test.cjs
