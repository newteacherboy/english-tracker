name: Word images - bilingual mapping and route panels
on:
  pull_request:
    paths:
      - 'ingilizce/parkur-word-pool-v1.json'
      - 'ingilizce/route-questions.js'
      - 'ingilizce/route-questions.css'
      - 'ingilizce/app-js/i24-oku.js'
      - 'ingilizce/thematic-learning.js'
      - 'ingilizce/thematic-learning.css'
      - 'ingilizce/index.html'
      - 'ingilizce/sw.js'
      - 'tests/parkur-word-image-pool.test.cjs'
      - '.github/workflows/word-image-2997-regression.yml'
  push:
    branches: [main]
    paths:
      - 'ingilizce/parkur-word-pool-v1.json'
      - 'ingilizce/route-questions.js'
      - 'ingilizce/app-js/i24-oku.js'
      - 'ingilizce/thematic-learning.js'
      - 'tests/parkur-word-image-pool.test.cjs'
jobs:
  word-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check ingilizce/route-questions.js
          node --check ingilizce/app-js/i24-oku.js
          node --check ingilizce/thematic-learning.js
      - name: Verify every bilingual picture and question integration
        run: node --test tests/parkur-word-image-pool.test.cjs
