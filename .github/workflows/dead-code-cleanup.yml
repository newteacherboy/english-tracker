name: Dead code cleanup regression
on:
  pull_request:
    paths:
      - 'ingilizce/index.html'
      - 'tests/dead-code-cleanup.test.cjs'
      - '.github/workflows/dead-code-cleanup.yml'
  push:
    paths:
      - 'ingilizce/index.html'
      - 'tests/dead-code-cleanup.test.cjs'
      - '.github/workflows/dead-code-cleanup.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dead-code-cleanup.test.cjs
