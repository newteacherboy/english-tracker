name: Deploy medupro-api Edge Function
# Deploys supabase/functions/medupro-api to production on push to main (same pattern as deploy-diji-api.yml).
# Requires the repository secret SUPABASE_ACCESS_TOKEN.
on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/medupro-api/**'
      - '.github/workflows/deploy-medupro-api.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish medupro-api to production'
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-medupro-api
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nxfqlutulxqzqgwewssd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pre-deploy checks
        run: |
          node --test tests/medupro-edge.test.cjs tests/medupro-presence.test.cjs tests/social-safety.test.mjs tests/teacher-important-notices.test.cjs tests/api-security-guards.test.cjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          supabase functions deploy medupro-api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Smoke check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "https://$PROJECT_REF.supabase.co/functions/v1/medupro-api")
          echo "OPTIONS status: $code"
          case "$code" in 2*|4*) echo "::notice title=Deploy::medupro-api responded ($code)";; *) echo "::error::medupro-api did not respond normally ($code)"; exit 1;; esac
