name: Runtime cleanup regression checks
on:
  push:
    paths: ['ingilizce/index.html', 'ingilizce/lazy-games.js', 'ingilizce/papi-flow.js', 'ingilizce/progression-ui.js', 'ingilizce/game-feedback.js', 'ingilizce/sw.js', 'ingilizce/portal-bootstrap.js', 'tests/portal-bootstrap.test.cjs', 'tests/runtime-cleanup.test.cjs', 'tests/progress-economy.test.cjs', '.github/workflows/runtime-cleanup.yml']
  pull_request:
    paths: ['ingilizce/index.html', 'ingilizce/lazy-games.js', 'ingilizce/papi-flow.js', 'ingilizce/progression-ui.js', 'ingilizce/game-feedback.js', 'ingilizce/sw.js', 'ingilizce/portal-bootstrap.js', 'tests/portal-bootstrap.test.cjs', 'tests/runtime-cleanup.test.cjs', 'tests/progress-economy.test.cjs', '.github/workflows/runtime-cleanup.yml']
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/portal-bootstrap.test.cjs tests/portal-session.test.cjs tests/notice-coordinator.test.cjs tests/dual-route.test.cjs tests/runtime-cleanup.test.cjs tests/progress-economy.test.cjs tests/portal-integrity.test.cjs tests/request-budget.test.cjs tests/parkur-reward-claim.test.cjs tests/reward-state.test.cjs tests/account-deletion-sw.test.cjs tests/classic-wordbank-rotation-smoke.test.cjs
