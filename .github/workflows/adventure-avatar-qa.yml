name: Student character and wardrobe verification
on:
  push:
    paths:
      - 'ingilizce/adventure-avatars.js'
      - 'ingilizce/avatar-assets/adventure-*.webp'
      - 'ingilizce/avatar-assets/head-*.webp'
      - 'ingilizce/index.html'
      - 'ingilizce/storefront.js'
      - 'ingilizce/storefront.css'
      - 'ingilizce/character-builder.js'
      - 'ingilizce/character-builder.css'
      - 'tests/character-builder-ui.cjs'
      - 'tests/adventure-avatars-ui.cjs'
      - 'tests/avatar-layer-rig-ui.cjs'
      - '.github/workflows/adventure-avatar-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avatar-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ingilizce/character-builder.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/character-builder-ui.cjs
      - run: node tests/legendary-shop-ui.cjs
      - name: Save student character and outfit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-character-qa
          path: |
            /tmp/student-character-builder.png
            /tmp/student-character-outfit.png
          if-no-files-found: ignore
