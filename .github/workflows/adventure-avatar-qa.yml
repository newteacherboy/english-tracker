name: Approved K2 E2 avatar verification
on:
  push:
    paths:
      - 'ingilizce/adventure-avatars.js'
      - 'ingilizce/avatar-assets/adventure-*.webp'
      - 'ingilizce/index.html'
      - 'ingilizce/storefront.js'
      - 'ingilizce/storefront.css'
      - 'tests/adventure-avatars-ui.cjs'
      - '.github/workflows/adventure-avatar-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avatar-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ingilizce/adventure-avatars.js
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/adventure-avatars-ui.cjs
      - name: Save K2 E2 and outfit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-k2-e2-qa
          path: |
            /tmp/approved-adventure-avatars.png
            /tmp/approved-adventure-outfit.png
          if-no-files-found: ignore
