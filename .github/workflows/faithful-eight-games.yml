name: Faithful Eight Games Layouts
on:
  pull_request:
    paths:
      - 'ingilizce/faithful-eight-games.*'
      - 'ingilizce/eight-game-fullscreen.*'
      - 'ingilizce/game-viewport.*'
      - 'tests/game-viewport*'
      - 'tests/quiz-flow-ui.cjs'
      - 'tests/contact-exit*'
      - 'tests/harf-bahcesi-start*'
      - 'tests/teacher-game-regressions*'
      - 'ingilizce/teacher-portal.*'
      - 'ingilizce/play-navigation.js'
      - 'tests/eight-game-fullscreen*'
      - 'ingilizce/game-scenes/**'
      - 'ingilizce/index.html'
      - 'tests/faithful-eight-games*'
      - '.github/workflows/faithful-eight-games.yml'
  push:
    paths:
      - 'ingilizce/faithful-eight-games.*'
      - 'ingilizce/eight-game-fullscreen.*'
      - 'ingilizce/game-viewport.*'
      - 'tests/game-viewport*'
      - 'tests/quiz-flow-ui.cjs'
      - 'tests/contact-exit*'
      - 'tests/harf-bahcesi-start*'
      - 'tests/teacher-game-regressions*'
      - 'ingilizce/teacher-portal.*'
      - 'ingilizce/play-navigation.js'
      - 'tests/eight-game-fullscreen*'
      - 'ingilizce/game-scenes/**'
      - 'ingilizce/index.html'
      - 'tests/faithful-eight-games*'
      - '.github/workflows/faithful-eight-games.yml'
permissions:
  contents: read
jobs:
  mobile-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate selected assets and gameplay layout contract
        run: node --test tests/faithful-eight-games.test.cjs tests/selected-eight-game-boards.test.cjs tests/harf-bahcesi-round-size.test.cjs tests/eight-game-fullscreen.test.cjs
      - name: Install UI test browser
        run: |
          npm install --prefix /tmp/faithful-ui --no-save playwright@1.62.1 jsdom@26.1.0
          /tmp/faithful-ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect eight real game screens on mobile and tablet
        env:
          NODE_PATH: /tmp/faithful-ui/node_modules
        run: CODEX_PRIMARY_RUNTIME_NODE_MODULES=/tmp/faithful-ui/node_modules node --test tests/game-viewport.test.cjs && node tests/play-navigation-ui.cjs && node tests/faithful-eight-games-ui.cjs && node tests/eight-game-fullscreen-ui.cjs && node tests/game-viewport-ui.cjs && node tests/teacher-game-regressions-ui.cjs && node tests/quiz-flow-ui.cjs && node tests/contact-exit-ui.cjs && node --test tests/teacher-portal-api.test.mjs tests/classroom-identity.test.mjs tests/contact-exit.test.cjs tests/harf-bahcesi-start.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-eight-game-ui-screenshots
          path: |
            /tmp/faithful-game-screens/*.png
            /tmp/eight-game-fullscreen/*.png
            /tmp/diji-game-viewport/*.png
            /tmp/contact-exit-screens/*.png
            /tmp/quiz-flow-*.png
