name: Route graduations and certificates
on:
  push:
    paths: ['ingilizce/route-graduation*', 'ingilizce/graduation-assets/**', 'ingilizce/bottom-nav.js', 'supabase/functions/diji-api/route-graduations.mjs', 'supabase/functions/diji-api/graduation-catalog.json', 'tests/route-graduations*', '.github/workflows/route-graduations.yml']
  pull_request:
    paths: ['ingilizce/route-graduation*', 'tests/route-graduations*']
permissions:
  contents: read
jobs:
  graduation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check ingilizce/route-graduation.js && node --test tests/route-graduations.test.cjs tests/portal-integrity.test.cjs tests/api-security-guards.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/route-graduations-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-graduations-qa
          path: /tmp/route-graduations-qa
