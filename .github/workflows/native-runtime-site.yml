name: Uygulama ortak katmanı (siteye)
# Android 1.3+ ve iOS 1.1+ kabukları reklam/abonelik/bildirim katmanını siteden yükler (ingilizce/native/runtime-*.js).
# android-app/src veya admob.config.json değişince bu iş akışı katmanı üretir ve main'e işler; yeni mağaza sürümü gerekmez.
on:
  push:
    branches: [main]
    paths: ['android-app/src/**', 'android-app/admob.config.json', 'android-app/scripts/build-site-runtime.mjs', 'supabase/functions/billing/ad-settings.mjs', '.github/workflows/native-runtime-site.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-runtime-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bağımlılıklar
        working-directory: android-app
        run: npm install --no-audit --no-fund
      - name: Testler
        working-directory: android-app
        run: npm test
      - name: Site katmanını üret
        working-directory: android-app
        run: node scripts/build-site-runtime.mjs
      - name: main'e işle
        run: |
          git config user.name "diji-medu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ingilizce/native/runtime-android.js ingilizce/native/runtime-ios.js
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Uygulama ortak katmanı siteye güncellendi"
          git checkout -- .   # npm install kilit dosyasını değiştirir; işlenmez
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
