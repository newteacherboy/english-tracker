name: Deploy billing Edge Function
# Manual only. Deploys supabase/functions/billing from the selected ref to production.
# Requires the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/billing/**'
      - '.github/workflows/deploy-billing.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish billing to production'
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-billing
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nxfqlutulxqzqgwewssd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pre-deploy checks
        run: node --test supabase/functions/billing/play.test.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          supabase functions deploy billing --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes
      - name: Smoke check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "https://$PROJECT_REF.supabase.co/functions/v1/billing")
          echo "OPTIONS status: $code"
          case "$code" in 2*|4*) echo "::notice title=Deploy::billing responded ($code)";; *) echo "::error::billing did not respond normally ($code)"; exit 1;; esac
