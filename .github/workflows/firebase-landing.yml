# Tanıtım sitesini (newteacherboy/dijimedu-site) bu repodaki Firebase anahtarıyla yayınlar.
# dijimedu-site reposunda anahtar tanımlı değilken elle çalıştırmak için.
name: firebase-landing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: newteacherboy/dijimedu-site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Yayınla
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project "$PROJECT" --non-interactive
