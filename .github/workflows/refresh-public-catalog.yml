name: Refresh public curriculum CDN
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-public-catalog.mjs'
      - '.github/workflows/refresh-public-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'
permissions:
  contents: write
concurrency:
  group: public-catalog-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-public-catalog.mjs
      - name: Publish changed public files
        run: |
          git add ingilizce/data/public-catalog
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh versioned public curriculum catalog'
          git pull --rebase origin main
          git push origin HEAD:main
