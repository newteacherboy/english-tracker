name: Teacher panel visual guard
on:
  pull_request:
    paths:
      - 'ingilizce/teacher-portal-boot.js'
      - 'ingilizce/teacher-portal.css'
      - 'ingilizce/teacher-portal.js'
      - 'ingilizce/teacher-workspace.js'
      - 'ingilizce/sw.js'
      - 'ingilizce/index.html'
      - 'tests/teacher-panel-visual-guard.test.cjs'
      - 'tests/teacher-panel-role-layout.test.cjs'
      - '.github/workflows/teacher-panel-visual-guard.yml'
  push:
    paths:
      - 'ingilizce/teacher-portal-boot.js'
      - 'ingilizce/teacher-portal.css'
      - 'ingilizce/teacher-portal.js'
      - 'ingilizce/teacher-workspace.js'
      - 'ingilizce/sw.js'
      - 'ingilizce/index.html'
      - 'tests/teacher-panel-visual-guard.test.cjs'
      - 'tests/teacher-panel-role-layout.test.cjs'
      - '.github/workflows/teacher-panel-visual-guard.yml'
permissions:
  contents: read
jobs:
  visual-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/teacher-guard-test jsdom@26.1.0 --no-audit --no-fund
      - run: node --test tests/teacher-panel-visual-guard.test.cjs tests/teacher-panel-role-layout.test.cjs
        env:
          NODE_PATH: /tmp/teacher-guard-test/node_modules
