# Firebase Hosting site yönetimi (elle çalıştırılır).
# - Projedeki siteleri listeler
# - Uygulama için ayrı site yoksa oluşturur (tanıtım sitesi varsayılan sitede kalır)
# Sonuçlar iş özetinde ve uyarı notlarında görünür.
name: firebase-sites

on:
  workflow_dispatch:
    inputs:
      create_app_site:
        description: "Uygulama sitesini oluştur (yoksa)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kimlik dosyası
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Siteler
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          CREATE: ${{ inputs.create_app_site }}
        run: |
          npm i -g firebase-tools@13 >/dev/null 2>&1
          list() { firebase hosting:sites:list --project "$PROJECT" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result||{};(r.sites||r||[]).forEach(x=>console.log(x.name.split("/").pop()+" "+(x.defaultUrl||"")+" "+(x.type||"")))})'; }
          list | tee sites.txt
          if [ "$CREATE" = "true" ] && ! grep -q -- "-app" sites.txt; then
            for id in dijimedu-app dijimedu-uygulama "${PROJECT}-app"; do
              if firebase hosting:sites:create "$id" --project "$PROJECT" --non-interactive; then echo "created $id"; break; fi
            done
            list | tee sites.txt
          fi
          while read -r line; do echo "::notice title=site::$line"; done < sites.txt
          { echo '### Firebase siteleri'; sed 's/^/- /' sites.txt; } >> "$GITHUB_STEP_SUMMARY"
