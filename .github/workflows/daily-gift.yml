name: Daily gift and login streak
on:
  pull_request:
    paths: ['ingilizce/daily-gift*', 'ingilizce/papi-wallet.*', 'supabase/functions/diji-api/index.ts', 'tests/daily-gift*', 'tests/daily-energy-bonus*', '.github/workflows/daily-gift.yml']
  push:
    branches: [main]
    paths: ['ingilizce/daily-gift*', 'ingilizce/papi-wallet.*', 'tests/daily-gift*', '.github/workflows/daily-gift.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0 playwright@1.58.2
      - run: node --test tests/daily-gift-ui.test.cjs tests/daily-energy-bonus.test.cjs tests/portal-integrity.test.cjs tests/api-security-guards.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/daily-gift-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-gift-and-streak
          path: /tmp/daily-gift-qa/*.png
