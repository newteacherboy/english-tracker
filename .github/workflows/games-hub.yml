name: Games hub
on:
  push:
    paths: ['ingilizce/activity-ui.*', 'ingilizce/games-assets/**', 'tests/games-design-selected-1.test.cjs', 'tests/games-hub-ui.cjs', 'tests/games-hub-integration.cjs', '.github/workflows/games-hub.yml']
  pull_request:
    paths: ['ingilizce/activity-ui.*', 'ingilizce/games-assets/**', 'tests/games-hub-ui.cjs', 'tests/games-hub-integration.cjs', '.github/workflows/games-hub.yml']
jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check ingilizce/activity-ui.js
      - run: node --test tests/games-design-selected-1.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/games-hub-ui.cjs
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules

      - run: node tests/games-hub-integration.cjs
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
