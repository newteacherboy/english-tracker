#dmDiscovery .fd-top{display:flex;align-items:center;gap:14px;flex-shrink:0;min-height:30px;margin-bottom:14px}
#dmDiscovery .fd-back{border:0;background:transparent;color:#49616c;font-size:24px;width:32px;height:36px;cursor:pointer}
#dmDiscovery .fd-progress{flex:1;height:6px;background:#e5e6da;border-radius:10px;overflow:hidden}
#dmDiscovery .fd-progress i{display:block;height:100%;background:#00b1b2;border-radius:10px;transition:width .25s}
#dmDiscovery .fd-step{font-size:12px;color:#577086;white-space:nowrap}
#dmDiscovery .fd-content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 0 8px;scrollbar-width:thin}
#dmDiscovery h1,#dmDiscovery h2{font-size:clamp(23px,5.8vw,30px);font-weight:850;line-height:1.16;text-align:center;margin:10px 0 22px;color:#102c52!important}
#dmDiscovery p{font-size:14px;line-height:1.5;color:#344f6e;text-align:center;margin:8px 0 14px}
#dmDiscovery .fd-actions{flex-shrink:0;display:grid;gap:10px;padding-top:10px}
#dmDiscovery button,#dmDiscovery a{touch-action:manipulation}
#dmDiscovery .fd-primary,#dmDiscovery .fd-secondary{width:100%;min-height:54px;border-radius:22px;padding:12px 16px;font-size:16px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px}
#dmDiscovery .fd-primary{background:linear-gradient(#12c9c7,#009ca8);color:#fff;border:2px solid #8ce0d8;box-shadow:inset 0 2px 0 #ffffff55,0 4px 0 #087f8a}
#dmDiscovery .fd-secondary{background:#fffdf6;color:#163858;border:2px solid #118f9d;box-shadow:none}
#dmDiscovery .fd-link{display:block;border:0;background:transparent;text-align:center;color:#143e62;text-decoration:underline;font-size:13px;font-weight:700;padding:10px;cursor:pointer;margin:auto}
#dmDiscovery button:disabled{opacity:.55;cursor:default}
#dmDiscovery :is(button,a,input,select):focus-visible{outline:3px solid #ffc766;outline-offset:3px}
#dmDiscovery .fd-art{display:block;width:100%;height:clamp(160px,30dvh,280px);object-fit:contain;margin:0 auto}
#dmDiscovery .fd-art-small{height:clamp(90px,18dvh,155px)}
#dmDiscovery .fd-welcome .fd-content{display:flex;flex-direction:column;justify-content:center}
#dmDiscovery .fd-welcome .fd-art{height:44dvh;max-height:390px;animation:fdFloat 3s ease-in-out infinite}
#dmDiscovery .fd-wordmark{font-size:clamp(42px,11vw,64px);font-weight:900;text-align:center;color:#008b9c;line-height:1.1;transform:rotate(-7deg);margin:8px 0 30px}
#dmDiscovery .fd-wordmark span{color:#143d83}
#dmDiscovery .fd-choice{display:flex;align-items:center;gap:14px;width:100%;padding:15px 13px;margin:12px 0;background:#fffdf7;border:2px solid #e0e5dc;border-radius:18px;text-align:left;color:#12314e;cursor:pointer;min-height:86px}
#dmDiscovery .fd-choice.selected{border-color:#00aeb8;box-shadow:0 3px 0 #b4e2d9;background:#f6fffa}
#dmDiscovery .fd-choice strong{display:block;font-size:17px;font-weight:800}
#dmDiscovery .fd-choice small{display:block;font-size:12px;line-height:1.4;margin-top:5px}
#dmDiscovery .fd-choice img{width:65px;height:65px;object-fit:contain}
#dmDiscovery .fd-check{margin-left:auto;color:#00a7ae;font-weight:900}
#dmDiscovery label.fd-field{display:block;font-size:13px;font-weight:650;margin:0 0 15px;color:#143858}
#dmDiscovery input:not([type=checkbox]),#dmDiscovery select{display:block;width:100%;min-height:49px;margin:6px 0 0;padding:11px 13px;border:1.5px solid #d5dcd7;border-radius:10px;background:#fffefa;color:#133b57;font-size:16px;box-shadow:none}
#dmDiscovery input::placeholder{color:#8093a6}
#dmDiscovery .fd-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#dmDiscovery .fd-optional{font-weight:400;font-size:11px;color:#567280}
#dmDiscovery .fd-private{background:#eaf2f0;color:#344f6e;border-radius:12px;padding:12px;font-size:12px;text-align:center}
#dmDiscovery .fd-card{margin:12px auto;padding:14px 18px;background:linear-gradient(140deg,#fffcdf,#e5f7f4);border:3px solid #ebc260;border-radius:20px;box-shadow:0 5px 0 #cfad5740;max-width:340px;text-align:center}
#dmDiscovery .fd-card strong{display:block;font-size:19px;color:#143451;overflow-wrap:anywhere}
#dmDiscovery .fd-card small{display:block;margin-top:5px;font-weight:650;color:#386075}
#dmDiscovery .fd-note{font-size:12px;color:#4b6879;margin:8px 0}
#dmDiscovery .fd-error{color:#b13635!important;background:#fff1ec;border-radius:12px;padding:10px;font-size:13px;line-height:1.4;display:none;margin:8px 0 0}
#dmDiscovery .fd-error:not(:empty){display:block}
#dmDiscovery .fd-password{position:relative}
#dmDiscovery .fd-password input{padding-right:52px}
#dmDiscovery .fd-eye{position:absolute;right:5px;top:5px;background:transparent;border:0;width:42px;height:38px;color:#357087;font-size:20px;cursor:pointer}
#dmDiscovery .fd-google{display:flex;gap:12px;justify-content:center;align-items:center;width:100%;padding:14px;border-radius:22px;background:#fff;border:1px solid #dadce0;color:#202124;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px #12324413}
#dmDiscovery .fd-google img{width:24px;height:24px;object-fit:contain}
#dmDiscovery .fd-divider{text-align:center;color:#486078;font-size:12px;border-top:1px solid #d5ddd7;padding-top:10px;margin:22px 0}
#dmDiscovery .fd-recap{background:#fffdf7;border:1px solid #dedfd1;border-radius:14px;padding:0 12px;margin:16px 0}
#dmDiscovery .fd-recap button{display:flex;justify-content:space-between;width:100%;gap:10px;padding:12px 0;border:0;border-bottom:1px solid #eee9da;background:transparent;color:#214965;font-size:12px;text-align:left;cursor:pointer;overflow-wrap:anywhere}
#dmDiscovery .fd-consent{display:flex;gap:10px;font-size:12px;line-height:1.5;text-align:left;align-items:flex-start;margin:14px 0}
#dmDiscovery .fd-consent input{width:20px;height:20px;flex-shrink:0;accent-color:#00a7ae}
#dmDiscovery .fd-consent a{color:#08778b}
#dmDiscovery .fd-question .fd-content{display:flex;flex-direction:column;overflow:hidden}
#dmDiscovery .fd-question h1{font-size:clamp(22px,5vw,28px);margin:10px 0 16px}
#dmDiscovery .fd-audio{display:flex;align-items:center;justify-content:center;gap:13px;border:1px solid #c9e4e4;background:#eefafa;border-radius:18px;padding:10px 20px;min-height:46px;color:#102f50;font-size:20px;font-weight:850;margin:0 auto 17px;cursor:pointer}
#dmDiscovery .fd-answers{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;flex:1;min-height:0}
#dmDiscovery .fd-answer{position:relative;background:#fffdf5;border:2px solid #e3e3d7;border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#163852;font-size:16px;font-weight:800;cursor:pointer;min-height:0}
#dmDiscovery .fd-answer img{width:100%;height:calc(100% - 28px);max-height:150px;min-height:0;object-fit:contain;margin-bottom:5px}
#dmDiscovery .fd-answer.correct{border-color:#00a6a8;background:#f2ffef}
#dmDiscovery .fd-answer.correct:after{content:'✓';position:absolute;right:9px;top:8px;border-radius:50%;background:#00aaa6;color:#fff;width:25px;height:25px;display:grid;place-items:center}
#dmDiscovery .fd-answer.wrong{border-color:#dd6a61;background:#fff1ed}
#dmDiscovery .fd-feedback{border-radius:16px;background:#ecf7d6;padding:12px;font-size:14px;font-weight:700;color:#25654b;text-align:center;min-height:42px}
#dmDiscovery .fd-feedback.wrong{color:#9a4136;background:#ffe9de}
#dmDiscovery .fd-home .fd-content{display:flex;flex-direction:column;gap:12px}
#dmDiscovery .fd-home h1{margin:6px 0;font-size:26px}
#dmDiscovery .fd-home-header{display:flex;align-items:center;gap:13px;font-size:12px;font-weight:700}
#dmDiscovery .fd-home-header img{width:48px;height:50px;object-fit:contain}
#dmDiscovery .fd-badge{padding:7px 12px;border-radius:20px;background:#eaf3ee;color:#316477}
#dmDiscovery .fd-hero{border-radius:22px;overflow:hidden;background:#fffef8;border:1px solid #d2e7db;box-shadow:0 4px 0 #b1d6c840;flex:1;min-height:200px;display:flex;flex-direction:column}

#dmDiscovery .fd-hero-scene img{height:100%;max-height:190px;width:70%;object-fit:contain}
#dmDiscovery .fd-hero-footer{display:flex;gap:10px;align-items:center;padding:12px;font-size:12px}
#dmDiscovery .fd-hero-footer strong{display:block;font-size:17px;margin-bottom:4px}
#dmDiscovery .fd-hero-footer .fd-primary{width:auto;min-width:100px;min-height:44px}
#dmDiscovery .fd-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#dmDiscovery .fd-tile{background:#fffef3;border:2px solid #efce72;border-radius:17px;padding:10px;color:#15344f;font-size:14px;font-weight:800;text-align:left;cursor:pointer}
#dmDiscovery .fd-tile img{width:100%;height:75px;object-fit:contain;display:block}
#dmDiscovery .fd-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#fffdf7;border-top:1px solid #c8e1d7;padding-top:10px;margin-top:12px}
#dmDiscovery .fd-nav button{border:0;background:transparent;color:#617587;font-size:11px;cursor:pointer;padding:8px 0}
#dmDiscovery .fd-nav button:first-child{color:#00a5ad}
#dmDiscovery .fd-nav svg{display:block;margin:0 auto 5px;width:23px;height:23px;fill:currentColor}
html.dm-discovery-guest #dmGuestTip{display:none!important}
html.dm-discovery-guest #dmGuestBar{background:#fffdf5;color:#14465b;min-height:38px}
html.dm-discovery-guest #dmGuestBar label,html.dm-discovery-guest #dmGuestHelp{display:none!important}
#dmDiscovery .fd-success h1{margin-bottom:10px}
@keyframes fdFloat{50%{transform:translateY(-9px) rotate(2deg)}}
@media(max-height:690px){#dmDiscovery .fd-screen{padding:10px 16px}#dmDiscovery .fd-top{margin-bottom:4px}#dmDiscovery h1{font-size:23px;margin:6px 0 13px}#dmDiscovery .fd-art-small{height:80px}#dmDiscovery .fd-field{margin-bottom:10px!important}#dmDiscovery .fd-card{padding:9px;margin:8px auto}#dmDiscovery .fd-answers{gap:8px}#dmDiscovery .fd-actions{gap:7px}#dmDiscovery .fd-primary,#dmDiscovery .fd-secondary{min-height:46px}#dmDiscovery .fd-tiles .fd-tile img{height:50px}}
@media(prefers-reduced-motion:reduce){#dmDiscovery *,#dmDiscovery *:before,#dmDiscovery *:after{animation:none!important;transition:none!important}}

 let draft={role:'student',first:'',last:'',username:'',grade:'',branch:'',school:'',code:new URLSearchParams(location.search).get('kod')||'',phone:'',email:'',method:'email',consent:false};
 const parse=(storage,key)=>{try{return JSON.parse(storage.getItem(key)||'null');}catch(_){return null;}};
 const saved=parse(ctx.session,DRAFT);if(saved&&Date.now()-saved.savedAt<3600000)draft={...draft,...saved.values,consent:false};else ctx.session.removeItem(DRAFT);
 const summary=parse(ctx.raw,SUMMARY);demoComplete=!!summary?.completed;
 function save(){ctx.session.setItem(DRAFT,JSON.stringify({savedAt:Date.now(),values:{...draft,consent:false}}));}

 function mount(){if(root)return;root=document.createElement('div');root.id='dmDiscovery';root.hidden=true;root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-label','Papi ile ilk keşif');document.body.append(root);
  root.addEventListener('click',onClick);root.addEventListener('submit',e=>{e.preventDefault();next();});root.addEventListener('input',e=>{const k=e.target.dataset.field;if(k){draft[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();}});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy){if(screen==='home')hide();else if(screen==='question'){showHome();}else if(screen==='register'&&step>0){step--;renderRegistration();}}if(e.key==='Tab'){const nodes=[...root.querySelectorAll('button:not(:disabled),a[href],input,select')].filter(n=>!n.hidden);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 }

  for(const node of document.body.children)if(node!==root&&!['SCRIPT','LINK','STYLE'].includes(node.tagName)&&!inerted.has(node)){inerted.set(node,node.inert);node.inert=true;}
  root.hidden=false;document.body.classList.add('dm-discovery-open');root.innerHTML=`<section class="fd-screen ${cls}"><header class="fd-top">${back?'<button type="button" class="fd-back" data-action="back" aria-label="Geri">←</button>':''}${progress?`<div class="fd-progress"><i style="width:${progress}%"></i></div>`:''}${screen==='question'?`<span class="fd-step">${question+1} / 6</span>`:''}</header><form class="fd-content" novalidate>${content}<div class="fd-error" role="status" aria-live="polite"></div></form><footer class="fd-actions">${actions}</footer></section>`;
  root.querySelector('h1')?.setAttribute('tabindex','-1');(root.querySelector('h1')||root.querySelector('button'))?.focus({preventScroll:true});

 function showHome(){screen='home';homeHidden=false;show(`<div class="fd-home-header">${image('papi-merhaba','','Papi')}<span class="fd-badge">Misafir keşfi</span></div><h1>İlk keşfine<br>hazır mısın?</h1><div class="fd-hero"><div class="fd-hero-scene">${image('papi-merhaba','','Papi')}</div><div class="fd-hero-footer"><div><strong>Papi ile ilk keşif</strong>Kısa bir İngilizce denemesi · 6 soru</div>${button('▶ Dene','demo')}</div></div><div class="fd-tiles"><button type="button" class="fd-tile" data-action="tab" data-tab="1">${image('top','','Top')}Oyunları keşfet →</button><button type="button" class="fd-tile" data-action="tab" data-tab="2">${image('kesif-adalari','','Öğrenme yolları')}Öğrenme yolları →</button></div>`,nav(),0,'fd-home',false);}

  if(step===0)body='<h1>Bu keşif kimin için?</h1>'+Object.entries(roles).map(([key,[label,copy,pic]])=>`<button type="button" class="fd-choice ${draft.role===key?'selected':''}" data-action="role" data-role="${key}" aria-pressed="${draft.role===key}">${image(pic,'',label)}<span><strong>${label}</strong><small>${copy}</small></span><span class="fd-check">${draft.role===key?'✓':'○'}</span></button>`).join('')+image('papi-kesif-karti','fd-art fd-art-small');
  if(step===1)body=`<h1>${draft.role==='parent'?'Çocuğunu tanıyalım':'Papi seni nasıl tanısın?'}</h1>${draft.role==='parent'?'<p class="fd-note">Mevcut sistemde çocuğun için öğrenci hesabı oluşturulur. Ayrı veli hesabı açılmaz.</p>':''}`+field('İsim','first',{max:30,extra:'autocomplete="given-name"'})+field('Soyisim','last',{max:30,extra:'autocomplete="family-name"'})+field('Kullanıcı adı','username',{max:draft.role==='teacher'?40:20,extra:'autocomplete="username" autocapitalize="off" spellcheck="false"'})+'<p class="fd-note">Bu adla seni arkadaşların görebilir. Gerçek adından farklı bir kullanıcı adı seç.</p>'+discoveryCard();
  if(step===2){body='<h1>'+(draft.role==='teacher'?'Okul bilgilerin':'Sana uygun rotayı hazırlayalım')+'</h1>';if(draft.role!=='teacher')body+=`<div class="fd-row"><label class="fd-field">Sınıf<select data-field="grade" required><option value="">Seç</option>${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${String(draft.grade)===String(i+1)?'selected':''}>${i+1}. sınıf</option>`).join('')}</select></label>`+field('Şube','branch',{max:10,placeholder:'Örn: A'})+'</div>';body+=field('Okul adı <span class="fd-optional">(isteğe bağlı)</span>','school',{required:false,placeholder:'Okulunu yazabilirsin'});if(draft.role!=='teacher')body+=field('Öğretmen kodu <span class="fd-optional">(varsa)</span>','code',{required:false,max:10,placeholder:'Kodu buraya yaz',extra:'autocapitalize="characters"'});body+=image('papi-kesif-karti','fd-art fd-art-small')+discoveryCard();}
  if(step===3)body='<h1>İlerlemene yeniden<br>ulaşabilmen için</h1>'+field('Telefon numarası','phone',{type:'tel',max:20,placeholder:'05XX XXX XX XX',extra:'autocomplete="tel" inputmode="tel"'})+field('E-posta adresi','email',{type:'email',placeholder:'ornek@eposta.com',extra:'autocomplete="email"'})+'<div class="fd-private">🔒 Bu bilgiler profilinde görünmez.</div>'+image('papi-mektup');
  if(step===4){body='<h1>Hesabını nasıl açalım?</h1>';if(googleSession){body+='<div class="fd-private">✓ Google hesabın doğrulandı.</div>'+image('papi-merhaba')+discoveryCard();actions=button('Bilgilerimi kontrol et →');}else{if(googleReady&&draft.role!=='teacher')body+='<button type="button" class="fd-google" data-action="google"><img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHZpZXdCb3g9IjAgMCA0OCA0OCIgYXJpYS1oaWRkZW49InRydWUiIGZvY3VzYWJsZT0iZmFsc2UiPjxwYXRoIGZpbGw9IiM0Mjg1RjQiIGQ9Ik00My42MSAyNC40NmMwLTEuMzYtLjEyLTIuNjYtLjM1LTMuOTJIMjR2Ny40M2gxMWE5LjQgOS40IDAgMCAxLTQuMDggNi4xOHY1LjE0aDYuNmMzLjg2LTMuNTUgNi4wOS04Ljc3IDYuMDktMTQuODN6Ii8+PHBhdGggZmlsbD0iIzM0QTg1MyIgZD0iTTI0IDQ0YzUuNSAwIDEwLjExLTEuODIgMTMuNTItNC45NmwtNi42LTUuMTRjLTEuODIgMS4yMi00LjE1IDEuOTUtNi45MiAxLjk1LTUuMzIgMC05LjgyLTMuNTktMTEuNDQtOC40Mkg1Ljc0djUuM0EyMCAyMCAwIDAgMCAyNCA0NHoiLz48cGF0aCBmaWxsPSIjRkJCQzA1IiBkPSJNMTIuNTYgMjcuNDNBMTIgMTIgMCAwIDEgMTEuOTMgMjRjMC0xLjE5LjIxLTIuMzQuNjMtMy40M3YtNS4zSDUuNzRBMjAgMjAgMCAwIDAgNCAyNGMwIDMuMjMuNzcgNi4yOSAxLjc0IDguNzNsNi44Mi01LjN6Ii8+PHBhdGggZmlsbD0iI0VBNDMzNSIgZD0iTTI0IDEyLjE1YzMgMCA1LjcgMS4wMyA3LjgyIDMuMDdsNS44Ni01Ljg2QTE5LjY5IDE5LjY5IDAgMCAwIDI0IDQgMjAgMjAgMCAwIDAgNS43NCAxNS4yN2w2LjgyIDUuM0MxNC4xOCAxNS43NCAxOC42OCAxMi4xNSAyNCAxMi4xNXoiLz48L3N2Zz4=" alt="">Google ile devam et</button><p class="fd-note">Google seçilirse şifre gerekmez.</p><div class="fd-divider">veya e-posta ile</div>';body+='<label class="fd-field">Şifre<div class="fd-password"><input id="fdPassword" type="password" minlength="8" maxlength="64" autocomplete="new-password" required><button type="button" class="fd-eye" data-action="eye" aria-label="Şifreyi göster">◉</button></div></label><p class="fd-note">En az 8 karakter</p>'+image('papi-merhaba','fd-art fd-art-small');actions=button('E-posta ile hesap oluştur →');}}
  if(step===5){body='<h1>Keşif kartın hazır!</h1>'+image('papi-kesif-karti','fd-art fd-art-small')+discoveryCard()+`<div class="fd-recap"><button type="button" data-action="edit" data-step="1">İsim Soyisim <strong>${escape(draft.first+' '+draft.last)}</strong> ✎</button><button type="button" data-action="edit" data-step="2">Okul <strong>${escape(draft.school||'Eklenmedi')}</strong> ✎</button>${draft.role==='teacher'?'':`<button type="button" data-action="edit" data-step="2">Öğretmen kodu <strong>${escape(draft.code||'Eklenmedi')}</strong> ✎</button>`}<button type="button" data-action="edit" data-step="3">E-posta adresi <strong>${maskEmail()}</strong> ✎</button></div><label class="fd-consent"><input type="checkbox" data-field="consent" ${draft.consent?'checked':''}><span><a href="gizlilik.html" target="_blank" rel="noopener">Gizlilik bilgilendirmesini</a> okudum, <a href="kullanim-kosullari.html" target="_blank" rel="noopener">kullanım koşullarını</a> kabul ediyorum.${draft.role!=='teacher'?' Çocuğun yasal temsilcisi olarak bu kayıt talebini iletiyorum.':''}</span></label>`;actions=button('Kaydı tamamla →','submit');}
  show(body,actions,((step+1)/7)*100);if(step===4&&!googleSession)$('fdPassword').value=password;
 }
 function collect(){root.querySelectorAll('[data-field]').forEach(el=>draft[el.dataset.field]=el.type==='checkbox'?el.checked:el.value.trim());save();}
 function validate(){const invalid=root.querySelector('input:invalid,select:invalid');if(invalid){invalid.reportValidity();return false;}if(step===1){if(!/^[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû .'-]{3,60}$/.test(draft.first+' '+draft.last)){error('İsim ve soyisim alanlarını harflerle doldur.');return false;}if(draft.first.length<2||draft.last.length<2){error('İsim ve soyisim alanlarını tamamla.');return false;}if(draft.role!=='teacher'&&!/^[A-Za-zÇĞİÖŞÜçğıöşü0-9._-]{3,20}$/.test(draft.username)){error('Kullanıcı adı 3–20 karakter olmalı; boşluk kullanma.');return false;}}
  if(step===3){const phone=draft.phone.replace(/\D/g,'');if(!/^(05\d{9}|5\d{9}|905\d{9})$/.test(phone)){error('Geçerli bir telefon numarası yaz (05XX XXX XX XX).');return false;}}
  return true;
 }
 function next(){if(busy||screen!=='register')return;collect();if(!validate())return;if(step===4&&!googleSession){password=$('fdPassword').value;if(password.length<8){error('Şifre en az 8 karakter olmalı.');return;}draft.method='email';}step=Math.min(5,step+1);renderRegistration();}
 async function submit(){collect();if(busy)return;if(!draft.consent){error('Gizlilik bilgilendirmesini ve kullanım koşullarını okuyup kayıt beyanını işaretle.');return;}lock(true);try{
  const body={ogrenciAdi:draft.username,adSoyad:(draft.first+' '+draft.last).trim(),sinif:draft.grade,sube:draft.branch,okul:draft.school,telefon:draft.phone,email:draft.email,ogretmenKodu:draft.code,kvkkOnay:true,kvkkOnayTarihi:new Date().toISOString()};
  if(draft.role==='teacher'){registered=await ctx.request({islem:'ogretmenKayitOl',kullaniciAdi:draft.username,adSoyad:body.adSoyad,telefon:draft.phone,email:draft.email,kurum:draft.school,sifre:password});password='';success();}
  else {registered=await ctx.request({...body,islem:googleSession?'googleKayit':'kayitOl',...(googleSession?{}:{sifre:password})},googleSession?.access_token);if(!registered.token)throw Error('Kayıt yanıtında oturum bulunamadı. Giriş ekranından hesabını kontrol et.');ctx.session.setItem('dm_discovery_new_session',JSON.stringify({token:registered.token,student:registered.ogrenci||draft.username,created:true,at:Date.now()}));password='';if(googleSession){verified=true;success();}else verification();}
 }catch(e){error(e.name==='AbortError'?'Bağlantı zaman aşımına uğradı. Tekrar denemeden önce giriş ekranından hesabını kontrol edebilirsin.':e.message);}finally{lock(false);}}
 function verification(){screen='verification';show('<h1>Son bir adım!</h1>'+image('papi-mektup')+'<h2>E-posta adresini doğrula</h2><p>Gönderdiğimiz bağlantıya dokun.</p><div class="fd-private">✉ '+maskEmail()+'</div><p class="fd-note">Hesabın oluşturuldu. Mevcut sistemde uygulamaya şimdi de devam edebilirsin.</p>'+(registered.mailQueued===false?'<p class="fd-note">Doğrulama e-postası henüz gönderilemedi; yeniden göndermeyi deneyebilirsin.</p>':''),button('Doğrulamayı kontrol et','verify')+button('Tekrar gönder','resend','secondary')+button('Şimdi uygulamaya devam et','success','link'),100,'',false);}
 async function checkVerification(){if(busy)return;lock(true);try{const data=await ctx.request({islem:'memberStatus',t:registered.token});if(data.emailVerified){verified=true;password='';success();}else error('Henüz doğrulanmadı. E-postadaki bağlantıya dokun; istersen uygulamaya şimdi devam edebilirsin.');}catch(e){error(e.message);}finally{lock(false);}}
 async function resend(){if(busy)return;lock(true);try{const r=await ctx.request({islem:'memberEmailResend',t:registered.token});error(r.mesaj);}catch(e){error(e.message);}finally{lock(false);}}
 function success(){screen='success';const teacher=draft.role==='teacher',s=parse(ctx.raw,SUMMARY);show(`<h1>${teacher?'Başvurun alındı!':'Hoş geldin, '+escape(draft.first)+'!'}</h1>`+image(teacher?'papi-mektup':'papi-kutlama')+discoveryCard()+`<p><strong>${teacher?'Öğretmen hesabın yönetici onayı bekliyor.':s?.completed?'6 soruluk keşfin kaydedildi.':'Hesabın hazır!'}</strong></p><p>${teacher?'Onaylandığında e-posta ile haber alacaksın.':'Rotan hazır, kaldığın yerden devam edebilirsin.'}</p>${!teacher&&!verified?'<p class="fd-note">E-posta doğrulaman henüz bekliyor.</p>':''}`,button(teacher?'Giriş ekranına dön':'Kaldığım yerden devam et →',teacher?'teacher-done':'enter'),100,'fd-success',false);}
 async function enter(){if(busy||!registered?.token)return;lock(true);try{
  const s=parse(ctx.raw,SUMMARY);if(s?.completed)await ctx.request({islem:'ekVeriKaydet',t:registered.token,ogrenci:registered.ogrenci||draft.username,anahtar:'dmFirstDiscovery',deger:JSON.stringify(s)});
  if(registered.status==='success'||registered.kayitOlustu){const r=await ctx.request({islem:'ekVeriGetir',t:registered.token,ogrenci:registered.ogrenci||draft.username,anahtar:'yo'});let y={};try{y=typeof r?.deger==='string'?JSON.parse(r.deger||'{}'):r?.deger||{};}catch(_){}if(!y.dmLearningPurpose){const base=Number(y.guncelleme)||0;y.dmLearningPurpose='school';y.guncelleme=Date.now();await ctx.request({islem:'ekVeriKaydet',t:registered.token,ogrenci:registered.ogrenci||draft.username,anahtar:'yo',_taban:base,deger:JSON.stringify(y)});}}
  ctx.raw.setItem('dm_discovery_return_tab',ctx.raw.getItem('dm_discovery_last_tab')||'0');
  ctx.raw.setItem('ing_token',registered.token);ctx.raw.setItem('ing_oturumAcik','true');ctx.raw.setItem('ing_aktifOgrenci',registered.ogrenci||draft.username);ctx.raw.setItem('ing_toplamSaniye','0');if(googleSession)ctx.raw.setItem('ing_google_auth','true');
  ctx.session.removeItem(DRAFT);ctx.session.removeItem('dm_discovery_new_session');ctx.session.removeItem('dm_discovery_google');ctx.raw.removeItem(SUMMARY);password='';if(ctx.navigate)ctx.navigate('./?preview-complete=1');else location.replace(location.pathname);
 }catch(e){error('Hesabın hazır; keşif sonucunu aktarırken bağlantı kesildi. Tekrar deneyebilirsin.');}finally{lock(false);}}
 async function google(){if(busy||!googleReady)return;collect();save();lock(true);try{ctx.session.setItem('dm_discovery_google','1');const callback=new URL(location.pathname,location.origin);callback.searchParams.set('kesifKayit','google');const {error:e}=await window.supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:callback.href,queryParams:{prompt:'select_account'}}});if(e)throw e;}catch(e){ctx.session.removeItem('dm_discovery_google');error('Google ile giriş başlatılamadı. E-posta ile devam edebilirsin.');lock(false);}}
 async function receiveGoogle(){if(!ctx.oauth)return;googleReady=true;step=4;renderRegistration();lock(true);try{const {data,error:e}=await window.supabaseClient.auth.getSession();if(e||!data.session)throw Error('Google oturumu alınamadı. E-posta ile devam edebilirsin.');googleSession=data.session;const r=await ctx.request({islem:'googleGiris'},googleSession.access_token);if(r.ok&&r.token){registered=r;verified=true;success();return;}if(r.baglantiGerekli){draft.method='google';step=draft.username&&draft.first&&draft.last&&draft.grade&&draft.branch&&draft.phone&&draft.email?5:1;renderRegistration();return;}throw Error(r.mesaj||'Google bağlantısı tamamlanamadı.');}catch(e){googleSession=null;step=4;renderRegistration();error(e.message);}finally{lock(false);history.replaceState(null,'',location.pathname);}}
 async function readiness(){if(window.dmAndroidUygulama||!window.supabaseClient?.auth)return;try{const r=await ctx.request({islem:'googleDurum'});googleReady=!!r.hazir&&await ctx.googleAvailable(typeof SUPABASE_ANON_KEY!=='undefined'?SUPABASE_ANON_KEY:'');}catch(_){googleReady=false;}}
 function onClick(e){const el=e.target.closest('[data-action]');if(!el||busy)return;const a=el.dataset.action;
  if(a==='begin')navigate('./?misafir=1&kesif=1');
  else if(a==='login')login();else if(a==='demo')demo();else if(a==='audio')speak();else if(a==='answer')choose(el.dataset.word);
  else if(a==='question-next'){selected='';question++;if(question===6){setSummary();invite();}else renderQuestion();}
  else if(a==='register'){step=0;renderRegistration();}else if(a==='role'){draft.role=el.dataset.role;googleSession=null;draft.method='email';renderRegistration();}
  else if(a==='next')next();else if(a==='submit')submit();else if(a==='edit'){step=Number(el.dataset.step);renderRegistration();}
  else if(a==='eye'){const input=$('fdPassword');input.type=input.type==='password'?'text':'password';el.setAttribute('aria-label',input.type==='password'?'Şifreyi göster':'Şifreyi gizle');}
  else if(a==='google')google();else if(a==='verify')checkVerification();else if(a==='resend')resend();else if(a==='success'){password='';success();}else if(a==='enter')enter();
  else if(a==='teacher-done'){ctx.session.removeItem(DRAFT);login();}
  else if(a==='tab')openTab(Number(el.dataset.tab));else if(a==='explore'){inviteDue=false;lastInvite=Date.now();hide();if(!homeHidden)showHome();}
  else if(a==='back'){if(screen==='register'){collect();if(step>0){if(step===4&&!googleSession)password=$('fdPassword')?.value||password;step--;renderRegistration();}else invite();}else if(screen==='question')showHome();}
 }
 function activityOpen(){if(screen==='question'||screen==='register'||screen==='verification'||screen==='success')return true;if(typeof OC!=='undefined'&&OC?.aktif)return true;
  return !![...document.querySelectorAll('#genelSonucOverlay.acik,#dmResultOverlay,.bz-oyun,.kp-oyun,.bs-perde,.hb-overlay,.gs-perde')].find(el=>el.getClientRects().length&&getComputedStyle(el).display!=='none');}
 function tick(){const now=performance.now();if(!document.hidden)activeMs+=Math.min(2000,now-lastTick);lastTick=now;if(!ctx.guest)return;if((inviteDue||(visited.size>=3&&activeMs>=120000))&&Date.now()-lastInvite>=120000&&!activityOpen()&&(!root||root.hidden||screen==='home'))invite();}
 function initialize(){mount();if(!ctx.guest)document.body.classList.add('dm-discovery-login');if(ctx.member){document.addEventListener('dm:login',()=>{const tab=ctx.raw.getItem('dm_discovery_return_tab');ctx.raw.removeItem('dm_discovery_return_tab');if(tab&&tab!=='0'){const fns=['dunyaAc','aktivitelerTamEkranAc','sanaOzelTamEkranAc','profilAc'];window[fns[Number(tab)]]?.();}},{once:true});return;}readiness();window.dmFirstDiscovery={openRegistration:()=>{step=0;renderRegistration();},showHome,invite,questions,activityOpen,notifyActivityComplete:()=>{inviteDue=true;},expire:()=>{inviteDue=true;if(!activityOpen())invite(true);},screen:()=>screen,hasPendingAccount:()=>!!registered,openLogin:login};
  const oldRegister=window.kayitOlAc;window.kayitOlAc=function(){if(ctx.member)return oldRegister?.apply(this,arguments);step=0;renderRegistration();};
  const pending=parse(ctx.session,'dm_discovery_new_session');if(pending?.token&&Date.now()-pending.at<3600000&&!ctx.member){registered={token:pending.token,ogrenci:pending.student,status:pending.created?'success':undefined};success();}else if(ctx.welcome){welcome();}else if(ctx.oauth){receiveGoogle();}else if(new URLSearchParams(location.search).get('kayit')==='1'&&!ctx.member){step=0;renderRegistration();}
  if(ctx.guest){document.addEventListener('dm:guest-ready',()=>{if(!registered)showHome();},{once:true});if($('dmGuestBar')&&!registered)showHome();const result=window.genelSonucEkraniGoster;if(typeof result==='function')window.genelSonucEkraniGoster=function(...args){const value=result.apply(this,args);inviteDue=true;return value;};
   document.addEventListener('click',e=>{const tab=e.target.closest('#bottomNavMobile [data-ekran]');if(tab)visited.add(tab.dataset.ekran);});setInterval(tick,1000);
  }
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initialize,{once:true});else initialize();
})();
