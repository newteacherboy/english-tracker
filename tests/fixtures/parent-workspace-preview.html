<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Veli paneli görünüm testi</title><style>body{margin:0;background:#e9efeb;font:13px system-ui;color:#163e36}header{display:flex;align-items:center;justify-content:center;gap:12px;min-height:48px}select{padding:7px;border:1px solid #afc6b8;border-radius:8px}iframe{display:block;margin:0 auto 20px;border:1px solid #b7c9bd;border-radius:20px;background:#fff;box-shadow:0 8px 30px #26463720}</style></head><body><header><b>Arayüz testi · Örnek veriler</b><select id="device" aria-label="Ekran boyutu"><option value="390,844">390 × 844</option><option value="375,667">375 × 667</option><option value="320,568">320 × 568</option></select></header><iframe id="preview" title="Veli paneli tasarım testi" width="390" height="844"></iframe><script>
const stub=()=>{
 const memory=new Map([['dm_parent_session_v1','ui-preview-only-not-a-session']]);
 Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k)},configurable:true});
 const nativeFetch=window.fetch.bind(window),words=[{en:'apple',tr:'elma'},{en:'book',tr:'kitap'},{en:'cat',tr:'kedi'},{en:'bag',tr:'çanta'},{en:'pencil',tr:'kalem'}],id='11111111-1111-4111-8111-111111111111';
 const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Istanbul'}).format(d);};
 const activity=Object.fromEntries(Array.from({length:7},(_,i)=>[day(6-i),[1,0,2,0,1,3,0][i]]));
 const parent={name:'Örnek Veli',email:'preview@example.invalid',verified:true,settings:{}};
 const children=[{id,full_name:'Irmak',plan:'premium_pro'},{id:'22222222-2222-4222-8222-222222222222',full_name:'Deniz',plan:'free'}];
 const makeQuestion=(word,type='choice')=>({...word,type,options:['apple','book','cat','pencil'],image:'https://nxfqlutulxqzqgwewssd.supabase.co/storage/v1/object/public/word-images/512/'+({"bag": "0013", "pencil": "0015", "book": "0029", "cat": "0031", "apple": "0147"})[word.en]+'.webp',tokens:word.en.split(''),join:'',pairs:words.slice(0,3)});
 const history=[{id:'33333333-3333-4333-8333-333333333333',kind:'test',cursor:0,total:5,correct:0,answers:[],createdAt:new Date().toISOString(),settings:{},question:makeQuestion(words[0])}];
 const goal={days:4,minutes:10};let current=history[0];
 const dashboard=()=>({ok:true,student:{id,name:'Irmak',classNo:5,streak:4,sameEmail:true},plan:'premium_pro',activity,goal,notices:[],words,summary:'Bu hafta 28 kelime ve ifade tekrar edildi.',history,lastStop:{class_no:5,unit_no:1},totalStops:12,gameSeconds:720,usage:{tests:0,games:0}});
 window.fetch=async(url,options)=>{
  if(!String(url).includes('/diji-api'))return nativeFetch(url,options);
  const b=JSON.parse(options.body);let data;
  if(b.islem==='parentMe')data={ok:true,parent,children};
  else if(b.islem==='parentPool')data={ok:true,words:b.settings.wordKeys?words.filter(w=>b.settings.wordKeys.includes(w.en+'|'+w.tr)):words};
  else if(b.islem==='parentStart'){const selected=b.settings.wordKeys?words.filter(w=>b.settings.wordKeys.includes(w.en+'|'+w.tr)):words;current={id:b.id,kind:b.kind,feature:b.feature,cursor:0,total:Math.min(b.settings.count,selected.length),correct:0,answers:[],createdAt:new Date().toISOString(),settings:{...b.settings,words:selected},question:makeQuestion(selected[0],b.settings.types[0])};data={ok:true,practice:current};}
  else if(b.islem==='parentResume')data={ok:true,practice:current};
  else if(b.islem==='parentAnswer'){const correct=b.answer===current.question.en;current.answers.push({...current.question,correct});current.cursor++;current.correct+=Number(correct);if(current.cursor===current.total)current.completedAt=new Date().toISOString();else current.question=makeQuestion(words[current.cursor],current.question.type);data={ok:true,practice:current};}
  else if(b.islem==='parentGoal'){goal.days=b.days;goal.minutes=b.minutes;data={ok:true};}
  else data=dashboard();
  return {ok:true,status:200,json:async()=>JSON.parse(JSON.stringify(data))};
 };
};
(async()=>{const html=await(await fetch('/ingilizce/veli-paneli.html')).text();document.getElementById('preview').srcdoc=html.replace('<head>','<head><base href="/ingilizce/"><script>('+stub.toString()+')();<\/script>');})();
document.getElementById('device').onchange=event=>{const [w,h]=event.target.value.split(',');const frame=document.getElementById('preview');frame.width=w;frame.height=h;};
</script></body></html>
