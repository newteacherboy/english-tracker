<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Okul Ağı Testi · Diji-Medu</title>
<style>
  :root { --bg:#f6f4ee; --card:#fff; --ink:#1d2a24; --muted:#5f6b65; --ok:#1f8a4c; --bad:#c0392b; --wait:#9a7b16; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.45 system-ui, sans-serif; padding:24px 16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  ul { list-style:none; padding:0; margin:0; }
  li { background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; gap:12px; align-items:center; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  li small { display:block; color:var(--muted); font-size:14px; }
  .st { font-weight:700; white-space:nowrap; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .wait { color:var(--wait); }
  #sonuc { margin:20px 0; padding:16px; border-radius:12px; background:var(--card); font-weight:600; }
  a.btn { display:inline-block; background:#2f6b4f; color:#fff; text-decoration:none; padding:12px 20px; border-radius:10px; font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>Okul ağı erişim testi</h1>
  <p class="lead">Bu sayfa açıldıysa sunucunun kendisi okul ağından erişilebilir. Aşağıda uygulamanın ihtiyaç duyduğu diğer adresler kontrol ediliyor.</p>
  <ul id="liste"></ul>
  <div id="sonuc">Kontrol ediliyor…</div>
  <a class="btn" href="./ingilizce/">Uygulamayı aç</a>
</main>
<script>
  const kontroller = [
    { ad: 'Bu sunucu', not: location.host, url: location.origin + '/manifest.json', zorunlu: true },
    { ad: 'Veritabanı ve giriş (Supabase)', not: 'nxfqlutulxqzqgwewssd.supabase.co', url: 'https://nxfqlutulxqzqgwewssd.supabase.co/auth/v1/health', zorunlu: true },
    { ad: 'Uygulama API (Papi, sohbet)', not: 'supabase.co/functions', url: 'https://nxfqlutulxqzqgwewssd.supabase.co/functions/v1/diji-api', zorunlu: true },
    { ad: 'Yazı tipleri (Google Fonts)', not: 'fonts.googleapis.com', url: 'https://fonts.googleapis.com/css2?family=Nunito', zorunlu: false },
    { ad: 'Eski yayın (GitHub Pages)', not: 'app.dijimedu.com', url: 'https://app.dijimedu.com/manifest.json?t=' + Date.now(), zorunlu: false },
  ];
  const liste = document.getElementById('liste');
  function dene(url, ms) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
      .then(() => true, () => false)
      .finally(() => clearTimeout(t));
  }
  Promise.all(kontroller.map(k => {
    const li = document.createElement('li');
    li.innerHTML = '<div>' + k.ad + '<small>' + k.not + '</small></div><span class="st wait">…</span>';
    liste.appendChild(li);
    return dene(k.url, 8000).then(ok => {
      const st = li.querySelector('.st');
      st.className = 'st ' + (ok ? 'ok' : 'bad');
      st.textContent = ok ? '✓ Açık' : '✗ Engelli';
      return { k, ok };
    });
  })).then(sonuclar => {
    const eksik = sonuclar.filter(s => s.k.zorunlu && !s.ok);
    document.getElementById('sonuc').innerHTML = eksik.length
      ? '<span class="bad">Uygulama bu ağda tam çalışmaz. Engelli: ' + eksik.map(s => s.k.ad).join(', ') + '.</span> Bu ekranın fotoğrafını gönderin.'
      : '<span class="ok">Gerekli adreslerin hepsi açık. Uygulama bu ağda çalışmalı.</span>';
  });
</script>
</body>
</html>
