<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<title>Ders Defteri</title>
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#1d2421;--mut:#6b756f;--line:#dcdcd2;--main:#1f5f4a;--ok:#2e7d4f;--no:#b3392f;--wait:#b7791f;--plan:#8a918c}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2521;--ink:#e8ece9;--mut:#93a09a;--line:#2e3833;--main:#5fb894;--ok:#5fc08a;--no:#e87a70;--wait:#e0b050;--plan:#8a968f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
h1{font-size:1.25rem;margin:0;padding:12px 16px 4px;letter-spacing:-.01em}
nav{display:flex;gap:4px;padding:4px 12px 8px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--main);color:#fff}
main{max-width:720px;margin:0 auto;padding:12px}
h2{font-size:1rem;margin:20px 4px 8px}
.l{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--plan);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.l.Yapıldı{border-left-color:var(--ok)}.l.Yapılmadı{border-left-color:var(--no)}.l.Ertelendi{border-left-color:var(--wait)}.l.late{border-left-color:var(--no);background:color-mix(in srgb,var(--no) 8%,var(--card))}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:700;background:none;border:0;color:var(--main);font:inherit;font-weight:700;padding:0;cursor:pointer;text-align:left}
.meta{color:var(--mut);font-size:.88rem}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
.acts .y{background:var(--ok);color:#fff;border-color:var(--ok)}.acts .n{color:var(--no);border-color:var(--no)}
.btn.p{background:var(--main);color:#fff;border-color:var(--main)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.sum b{display:block;font-size:1.3rem}.sum span{color:var(--mut);font-size:.85rem}
select,input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px;width:min(340px,92vw)}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0 2px;color:var(--mut);font-size:.85rem}
dialog input{width:100%}
.empty{color:var(--mut);padding:24px 4px;text-align:center}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;display:none}
</style>
</head>
<body>
<header><h1>Ders Defteri</h1>
<nav><button data-v="bugun">Bugün</button><button data-v="tum">Tüm dersler</button><button data-v="ogr">Öğrenciler</button></nav></header>
<main id="app"><p class="empty">Yükleniyor…</p></main>
<dialog id="dlg"><form method="dialog" id="f"></form></dialog>
<div id="msg"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwTZBAtKv1bI5gZMzP6QEPO_qmyXVuQ-meisRQYtV_44pR9RY2wCueNGeaXnScUyFHc/exec'; // Dağıtım sonrası aldığın /exec adresi
let token = localStorage.getItem('dersToken') || '';
let D = {ogr: [], ders: [], ode: []}, view = 'bugun', sel = null, fOgr = '', fDur = '';
const $ = id => document.getElementById(id);
const today = () => new Date().toLocaleDateString('sv-SE');
const money = n => Number(n || 0).toLocaleString('tr-TR') + ' ₺';
const fd = t => new Date(t + 'T12:00').toLocaleDateString('tr-TR', {day: 'numeric', month: 'short', weekday: 'short'});
const og = id => D.ogr.find(o => o.ID === String(id)) || {Ad: '?', Ders: ''};
const toast = m => { const e = $('msg'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2200); };

async function api(action, data = {}) {
  const r = await fetch(API_URL, {method: 'POST', body: JSON.stringify({token, action, ...data})});
  const j = await r.json();
  if (!j.ok) { if (/Şifre/.test(j.error)) { localStorage.removeItem('dersToken'); token = ''; } throw new Error(j.error); }
  return j.data;
}
async function load() {
  if (!token) { token = prompt('Şifre (Apps Script içindeki TOKEN):') || ''; localStorage.setItem('dersToken', token); }
  try { D = await api('all'); render(); }
  catch (e) { $('app').innerHTML = `<p class="empty">Hata: ${e.message}<br><button class="btn" onclick="load()">Tekrar dene</button></p>`; }
}
async function act(action, data, ok) { try { await api(action, data); toast(ok); await load(); } catch (e) { toast(e.message); } }

function sorted(a) { return a.slice().sort((x, y) => (x.Tarih + x.Saat).localeCompare(y.Tarih + y.Saat)); }
function lesson(l, name = true) {
  const late = l.Durum === 'Planlı' && l.Tarih < today();
  const pend = l.Durum === 'Planlı';
  return `<div class="l ${late ? 'late' : l.Durum}"><div class="top">${name ? `<button class="nm" onclick="openOgr('${l.OgrenciID}')">${og(l.OgrenciID).Ad}</button>` : `<b>${fd(l.Tarih)}</b>`}<span class="meta">${name ? fd(l.Tarih) + ' ' : ''}${l.Saat} · ${l.SureDk} dk</span></div>
  <div class="meta">${og(l.OgrenciID).Ders} · ${money(l.Ucret)} · ${late ? 'Onay bekliyor' : l.Durum}${l.Not ? ' · ' + l.Not : ''}</div>
  <div class="acts">${pend ? `<button class="y" onclick="yap('${l.ID}')">Yaptım</button><button class="n" onclick="yapma('${l.ID}')">Yapmadım</button>` : `<button onclick="act('durum',{id:'${l.ID}',durum:'Planlı'},'Planlıya alındı')">Planlıya al</button>`}
  ${l.Durum !== 'Ertelendi' ? `<button onclick="ertele('${l.ID}')">Ertele</button>` : ''}</div></div>`;
}
const yap = id => act('durum', {id, durum: 'Yapıldı'}, 'Ders işlendi');
function yapma(id) { const l = D.ders.find(x => x.ID === id); const al = confirm('Ders yapılmadı. Yine de ücret alınacak mı?'); act('durum', {id, durum: 'Yapılmadı', ucret: al ? l.Ucret : 0}, 'Yapılmadı olarak işlendi'); }

function dialog(title, fields, onOk) {
  $('f').innerHTML = `<b>${title}</b>${fields.map(f => `<label>${f.l}</label><input id="d_${f.k}" type="${f.t}" value="${f.v || ''}">`).join('')}<div class="acts"><button class="btn p" value="ok">Kaydet</button><button class="btn" value="x">Vazgeç</button></div>`;
  $('dlg').onclose = () => { if ($('dlg').returnValue === 'ok') onOk(Object.fromEntries(fields.map(f => [f.k, $('d_' + f.k).value]))); };
  $('dlg').showModal();
}
function ertele(id) { const l = D.ders.find(x => x.ID === id); dialog('Dersi ertele', [{k: 'tarih', l: 'Yeni tarih', t: 'date', v: l.Tarih}, {k: 'saat', l: 'Yeni saat', t: 'time', v: l.Saat}], v => v.tarih && v.saat && act('ertele', {id, ...v}, 'Ertelendi')); }
function ekstra(oid) { dialog('Ekstra / telafi dersi', [{k: 'tarih', l: 'Tarih', t: 'date', v: today()}, {k: 'saat', l: 'Saat', t: 'time', v: '16:00'}], v => v.tarih && v.saat && act('ekle', {ogrenciId: oid, ...v}, 'Ders eklendi')); }
function odeme(oid) { dialog('Ödeme ekle', [{k: 'tutar', l: 'Tutar (₺)', t: 'number'}, {k: 'not', l: 'Not', t: 'text'}], v => v.tutar && act('odeme', {ogrenciId: oid, tutar: v.tutar, not: v.not}, 'Ödeme kaydedildi')); }
function openOgr(id) { sel = id; view = 'detay'; render(); scrollTo(0, 0); }

function stats(id) {
  const L = D.ders.filter(l => l.OgrenciID === id), done = L.filter(l => l.Durum === 'Yapıldı');
  const kazanc = L.filter(l => l.Durum === 'Yapıldı' || (l.Durum === 'Yapılmadı' && Number(l.Ucret) > 0)).reduce((a, l) => a + Number(l.Ucret), 0);
  const odenen = D.ode.filter(o => o.OgrenciID === id).reduce((a, o) => a + Number(o.Tutar), 0);
  return {n: done.length, saat: done.reduce((a, l) => a + Number(l.SureDk), 0) / 60, kazanc, odenen, kalan: kazanc - odenen};
}

function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view || (view === 'detay' && b.dataset.v === 'ogr')));
  const t = today(), P = D.ders.filter(l => l.Durum === 'Planlı'); let h = '';
  if (view === 'bugun') {
    const late = sorted(P.filter(l => l.Tarih < t)), now = sorted(P.filter(l => l.Tarih === t)), next = sorted(P.filter(l => l.Tarih > t)).slice(0, 5);
    h = (late.length ? `<h2>Onay bekleyen (${late.length})</h2>` + late.map(l => lesson(l)).join('') : '') +
      `<h2>Bugün</h2>` + (now.length ? now.map(l => lesson(l)).join('') : '<p class="empty">Bugün ders yok.</p>') +
      (next.length ? `<h2>Sıradaki dersler</h2>` + next.map(l => lesson(l)).join('') : '');
  } else if (view === 'tum') {
    let L = sorted(D.ders).filter(l => (!fOgr || l.OgrenciID === fOgr) && (!fDur || l.Durum === fDur));
    h = `<div class="bar"><select onchange="fOgr=this.value;render()"><option value="">Tüm öğrenciler</option>${D.ogr.map(o => `<option value="${o.ID}" ${fOgr === o.ID ? 'selected' : ''}>${o.Ad}</option>`).join('')}</select>
    <select onchange="fDur=this.value;render()">${['', 'Planlı', 'Yapıldı', 'Yapılmadı', 'Ertelendi'].map(d => `<option value="${d}" ${fDur === d ? 'selected' : ''}>${d || 'Tüm durumlar'}</option>`).join('')}</select></div>` +
      (L.length ? L.map(l => lesson(l)).join('') : '<p class="empty">Bu filtrede ders yok.</p>');
  } else if (view === 'ogr') {
    h = D.ogr.map(o => { const s = stats(o.ID); return `<div class="l"><div class="top"><button class="nm" onclick="openOgr('${o.ID}')">${o.Ad}</button><span class="meta">${o.Ders}</span></div><div class="meta">${o.SureDk} dk · ders başı ${money(o.DersBasiUcret)} · Kalan: <b>${money(s.kalan)}</b></div></div>`; }).join('') || '<p class="empty">Ogrenciler sayfasına öğrenci ekle.</p>';
  } else {
    const o = og(sel), s = stats(sel);
    h = `<button class="btn" onclick="view='ogr';render()">← Öğrenciler</button><h2 style="font-size:1.3rem">${o.Ad} <span class="meta">${o.Ders}</span></h2>
    <div class="sum"><div><b>${s.n}</b><span>yapılan ders (${s.saat.toLocaleString('tr-TR')} saat)</span></div><div><b>${money(s.kazanc)}</b><span>toplam ücret</span></div><div><b>${money(s.odenen)}</b><span>ödenen</span></div><div><b>${money(s.kalan)}</b><span>kalan</span></div></div>
    <div class="acts"><button class="btn p" onclick="odeme('${sel}')">Ödeme ekle</button><button class="btn" onclick="ekstra('${sel}')">Ekstra ders ekle</button></div><h2>Tüm ders tarihleri</h2>` +
      sorted(D.ders.filter(l => l.OgrenciID === sel)).map(l => lesson(l, false)).join('');
  }
  $('app').innerHTML = h;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
load();
</script>
</body>
</html>
