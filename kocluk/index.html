<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Koçum - Giriş Portalı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FAF8F5;
            background-image: 
                radial-gradient(at 0% 0%, rgba(218, 203, 182, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(125, 100, 81, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(244, 239, 230, 0.8) 0px, transparent 70%),
                radial-gradient(at 100% 100%, rgba(191, 172, 150, 0.25) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(125, 100, 81, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Ana Portala Dönüş Tuşu */
        .back-to-portal {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #dcedc8;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #2e7d32;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .back-to-portal:hover {
            background: #2e7d32;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Giriş Kutusu Tasarımı */
        .login-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .portal-icon {
            font-size: 42px;
            margin-bottom: 12px;
            display: inline-block;
        }

        h2 {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .portal-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #f0f4f8;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14.5px;
            font-weight: 600;
            color: #333;
            text-align: center;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            background-color: #ffffff;
            border-color: #2e7d32;
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #1b5e20;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(46, 125, 50, 0.35);
        }

        #hataMesaji {
            color: #c62828;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <!-- Ana Portala Dönüş Butonu -->
    <a href="https://panel.ogretmencocuk.com/" class="back-to-portal">← Ana Portala Dön</a>

    <div class="login-box">
        <div class="portal-icon">🎓</div>
        <h2>Öğrenci Giriş Portalı</h2>
        <p class="portal-desc">Lütfen sistemde kayıtlı Adınızı ve Soyadınızı, ardından şifrenizi giriniz.</p>

        <div class="input-group">
            <input type="text" id="ogrenciAdi" placeholder="ADINIZ SOYADINIZ">
        </div>
        <div class="input-group">
            <input type="password" id="sifre" placeholder="ŞİFRENİZ" onkeydown="if(event.key==='Enter')girisYap()">
        </div>

        <button type="button" id="girisBtn" onclick="girisYap()">Giriş Yap</button>
        <div id="hataMesaji"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUe6yNNarha3W7CnN32jidOZXBO1-yZXPDOtVzmiFv9Fwm-3c7s47FTIuvV5eNsjoc/exec";

        function girisYap() {
            const ogrenciAdiInput = document.getElementById("ogrenciAdi");
            const sifreInput = document.getElementById("sifre");
            const hataDiv = document.getElementById("hataMesaji");

            const ogrenciAdi = ogrenciAdiInput ? ogrenciAdiInput.value.trim() : "";
            const sifre = sifreInput ? sifreInput.value.trim() : "";

            if (!ogrenciAdi || !sifre) {
                hataDiv.innerText = "Lütfen kullanıcı adı ve şifrenizi girin!";
                return;
            }

            hataDiv.style.color = "#2e7d32";
            hataDiv.innerText = "Giriş yapılıyor...";

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "login", ogrenciAdi: ogrenciAdi, sifre: sifre })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    localStorage.setItem("aktifOgrenci", btoa(data.ogrenciAdi));
                    window.location.href = "panel.html";
                } else {
                    hataDiv.style.color = "#c62828";
                    hataDiv.innerText = "Hatalı kullanıcı adı veya şifre!";
                }
            })
            .catch(err => {
                hataDiv.style.color = "#c62828";
                hataDiv.innerText = "Bağlantı hatası oluştu!";
            });
        }
    </script>
</body>
</html>
