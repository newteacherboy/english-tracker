<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Koçum - Giriş Portalı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h2 { color: #2e7d32; margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #1b5e20; }
        #hataMesaji { color: #d32f2f; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Minik Koçluk Girişi</h2>
        <div class="input-group">
            <label>Öğrenci Adı</label>
            <input type="text" id="ogrenciAdi" placeholder="Örn: Ali">
        </div>
        <div class="input-group">
            <label>Şifre</label>
            <input type="password" id="sifre" placeholder="Şifreniz">
        </div>
        <button type="button" id="girisBtn" onclick="girisYap()">Giriş Yap</button>
        <div id="hataMesaji"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPBaRr7Kpo4GxmclN-Fz-iTY2DG1_7VFEI7JZxfbV8HfC9VTOw14c72yPYLIpdPGG7/exec";

        function girisYap() {
            const ogrenciAdiInput = document.getElementById("ogrenciAdi");
            const sifreInput = document.getElementById("sifre");
            const hataDiv = document.getElementById("hataMesaji");

            const ogrenciAdi = ogrenciAdiInput ? ogrenciAdiInput.value.trim() : "";
            const sifre = sifreInput ? sifreInput.value.trim() : "";

            if (!ogrenciAdi || !sifre) {
                hataDiv.innerText = "Lütfen kullanıcı adı ve şifrenizi girin!";
                return;
            }

            hataDiv.innerText = "Giriş yapılıyor...";

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "login", ogrenciAdi: ogrenciAdi, sifre: sifre })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    localStorage.setItem("aktifOgrenci", btoa(data.ogrenciAdi)); // btoa ile öğrenci adını tarayıcıda gizliyoruz
                    window.location.href = "panel.html";
                } else {
                    hataDiv.innerText = "Hatalı kullanıcı adı veya şifre!";
                }
            })
            .catch(err => {
                hataDiv.innerText = "Bağlantı hatası oluştu!";
            });
        }
    </script>
</body>
</html>
