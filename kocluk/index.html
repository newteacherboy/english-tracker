<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Koçum - Giriş Portalı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FAF8F5;
            background-image: 
                radial-gradient(at 0% 0%, rgba(218, 203, 182, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(125, 100, 81, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(244, 239, 230, 0.8) 0px, transparent 70%),
                radial-gradient(at 100% 100%, rgba(191, 172, 150, 0.25) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(125, 100, 81, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Ana Portala Dönüş Tuşu */
        .back-to-portal {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #dcedc8;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #2e7d32;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .back-to-portal:hover {
            background: #2e7d32;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Giriş Kutusu Tasarımı */
        .login-box {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .portal-icon {
            font-size: 42px;
            margin-bottom: 12px;
            display: inline-block;
        }

        h2 {
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .portal-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #f0f4f8;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14.5px;
            font-weight: 600;
            color: #333;
            text-align: center;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            background-color: #ffffff;
            border-color: #2e7d32;
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
            transition: all 0.2s;
        }

        button:hover {
            background-color: #1b5e20;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(46, 125, 50, 0.35);
        }

        #hataMesaji {
            color: #c62828;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
            min-height: 18px;
        }

               .sifre-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999999; padding: 16px;
        }
        .sifre-modal-content {
            background: #fff; border-radius: 20px; width: 100%; max-width: 380px;
            padding: 26px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            max-height: 90vh; overflow-y: auto; text-align: left;
        }
        .sifre-modal-baslik {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px;
        }
        .sifre-modal-baslik h3 { color: #1b5e20; font-size: 17px; font-weight: 800; margin: 0; }
        .sifre-modal-kapat {
            background: none; border: none; font-size: 18px; cursor: pointer; color: #94a3b8;
        }
        .sifre-modal-alt-metin { font-size: 12px; color: #666; margin-bottom: 16px; line-height: 1.4; }
        .sifre-form-group { margin-bottom: 12px; }
        .sifre-form-group label {
            display: block; font-size: 11.5px; font-weight: 700; color: #444; margin-bottom: 4px;
        }
        .sifre-form-group input, .sifre-form-group textarea {
            width: 100%; padding: 10px 12px; background: #f0f4f8; border: 1.5px solid #e2e8f0;
            border-radius: 10px; font-size: 13px; font-weight: 600; color: #333; outline: none;
            text-align: left; font-family: inherit;
        }
        .sifre-form-group input:focus, .sifre-form-group textarea:focus {
            background: #fff; border-color: #2e7d32; box-shadow: 0 0 0 4px rgba(46,125,50,.1);
        }
        .sifre-form-group textarea { resize: vertical; }
        .sifre-sayac { font-size: 9.5px; color: #94a3b8; text-align: right; margin-top: 2px; }
        .sifre-gonder-btn {
            width: 100%; padding: 13px; background: #2e7d32; color: #fff; border: none;
            border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 6px;
        }
        .sifre-gonder-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .sifre-sonuc-mesaj { font-size: 12px; margin-top: 10px; text-align: center; font-weight: 700; min-height: 16px; }

        .oturum-yukleme-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #f7f5f0; z-index: 999999;
    display: none; flex-direction: column; align-items: center; justify-content: center;
}
.oturum-yukleme-baykus {
    font-size: 64px; animation: baykusSallan 1.4s ease-in-out infinite;
}
@keyframes baykusSallan {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
}
.oturum-yukleme-yazi {
    margin-top: 14px; font-size: 13px; font-weight: 700; color: #2f855a;
}
.oturum-yukleme-nokta::after {
    content: '...'; animation: noktaAnim 1.2s steps(4, end) infinite;
}
@keyframes noktaAnim {
    0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; }
}
        
    </style>
</head>
<body>

    

    <!-- Ana Portala Dönüş Butonu -->
    <a href="https://panel.ogretmencocuk.com/" class="back-to-portal">← Ana Portala Dön</a>

    

    <div class="login-box">
        <div class="portal-icon">🎓</div>
        <h2>Öğrenci Giriş Portalı</h2>
        <p class="portal-desc">Lütfen sistemde kayıtlı Adınızı ve Soyadınızı, ardından şifrenizi giriniz.</p>

        <div class="input-group">
            <input type="text" id="ogrenciAdi" placeholder="KULLANICI ADINIZ">
        </div>
        <div class="input-group">
            <input type="password" id="sifre" placeholder="ŞİFRENİZ" onkeydown="if(event.key==='Enter')girisYap()">
        </div>

               <button type="button" id="girisBtn" onclick="girisYap()">Giriş Yap</button>
        <div id="hataMesaji"></div>
        <div style="text-align:center; margin-top:6px;">
            <a href="javascript:void(0)" onclick="sifremiUnuttumAc()" style="font-size:11.5px; color:#2e7d32; font-weight:700; text-decoration:none;">Şifremi unuttum?</a>
        </div>

<div class="oturum-yukleme-overlay" id="oturumYuklemeOverlay">
    <div class="oturum-yukleme-baykus">🦉</div>
    <div class="oturum-yukleme-yazi">Oturumun yükleniyor<span class="oturum-yukleme-nokta"></span></div>
</div>
        
    </div>

    <!-- ŞİFREMİ UNUTTUM MODALI -->
    <div class="sifre-modal-overlay" id="sifreIslemModal">
        <div class="sifre-modal-content">
            <div class="sifre-modal-baslik">
                <h3>🔑 Şifremi Unuttum</h3>
                <button class="sifre-modal-kapat" onclick="sifreIslemKapat()">✕</button>
            </div>
            <p class="sifre-modal-alt-metin">Kimliğini doğrulamak için aşağıdaki bilgileri eksiksiz doldur.</p>

            <div class="sifre-form-group">
                <label>Kullanıcı Adın:</label>
                <input type="text" id="sifreIslemKullaniciAdi" placeholder="Kullanıcı adınız">
            </div>
            <div class="sifre-form-group">
                <label>Kayıtlı Veli Telefon Numarası:</label>
                <input type="text" id="sifreIslemTelefon" placeholder="05XXXXXXXXX">
            </div>
            <div class="sifre-form-group">
                <label>Neden değiştiriyorsun? (en az 10 karakter):</label>
                <textarea id="sifreIslemNeden" rows="2" placeholder="Örn: Şifremi unuttum, yeni bir şifre belirlemek istiyorum."></textarea>
                <div class="sifre-sayac" id="sifreIslemNedenSayac">0 / 10</div>
            </div>
            <div class="sifre-form-group">
                <label>Yeni Şifre:</label>
                <input type="password" id="sifreIslemYeniSifre1" placeholder="Yeni şifreniz">
            </div>
            <div class="sifre-form-group">
                <label>Yeni Şifre (Tekrar):</label>
                <input type="password" id="sifreIslemYeniSifre2" placeholder="Yeni şifrenizi tekrar girin">
            </div>

            <button class="sifre-gonder-btn" id="sifreIslemGonderBtn" onclick="sifreIslemGonder()">Şifreyi Güncelle</button>
            <div class="sifre-sonuc-mesaj" id="sifreIslemSonucMesaj"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxm1Ym232923XovK5BO27GR9u7ErfQDYiFeEbEXBuL1eHQ0VYl9NBvmsAvDAyGrFiBu/exec";

        function girisYap() {
    const ogrenciAdiInput = document.getElementById("ogrenciAdi");
    const sifreInput = document.getElementById("sifre");
    const hataDiv = document.getElementById("hataMesaji");
    const yuklemeEkrani = document.getElementById("oturumYuklemeOverlay");

    const ogrenciAdi = ogrenciAdiInput ? ogrenciAdiInput.value.trim() : "";
    const sifre = sifreInput ? sifreInput.value.trim() : "";

    if (!ogrenciAdi || !sifre) {
        hataDiv.innerText = "Lütfen kullanıcı adı ve şifrenizi girin!";
        return;
    }

    hataDiv.innerText = "";

    // YENİ: Baykuş yükleme ekranını göster
    yuklemeEkrani.style.display = "flex";

    fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "login", ogrenciAdi: ogrenciAdi, sifre: sifre })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            localStorage.setItem("aktifOgrenci", btoa(data.ogrenciAdi));
            window.location.href = "panel.html";
            // Not: yönlendirme olduğu için overlay'i kapatmaya gerek yok, sayfa zaten değişiyor
        } else {
            // YENİ: Hata varsa yükleme ekranını kapat, hatayı göster
            yuklemeEkrani.style.display = "none";
            hataDiv.style.color = "#c62828";
            hataDiv.innerText = "Hatalı kullanıcı adı veya şifre!";
        }
    })
        .catch(err => {
        // YENİ: Bağlantı hatasında da yükleme ekranını kapat
        yuklemeEkrani.style.display = "none";
        hataDiv.style.color = "#c62828";
        hataDiv.innerText = "Bağlantı hatası oluştu!";
    });
}

        // ===== ŞİFREMİ UNUTTUM =====
        function sifremiUnuttumAc() {
            document.getElementById('sifreIslemKullaniciAdi').value = "";
            document.getElementById('sifreIslemTelefon').value = "";
            document.getElementById('sifreIslemNeden').value = "";
            document.getElementById('sifreIslemNedenSayac').innerText = "0 / 10";
            document.getElementById('sifreIslemNedenSayac').style.color = "#94a3b8";
            document.getElementById('sifreIslemYeniSifre1').value = "";
            document.getElementById('sifreIslemYeniSifre2').value = "";
            document.getElementById('sifreIslemSonucMesaj').innerText = "";
            document.getElementById('sifreIslemModal').style.display = 'flex';
        }

        function sifreIslemKapat() {
            document.getElementById('sifreIslemModal').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            let nedenEl = document.getElementById('sifreIslemNeden');
            if (nedenEl) {
                nedenEl.addEventListener('input', function() {
                    let uzunluk = this.value.trim().length;
                    let sayacEl = document.getElementById('sifreIslemNedenSayac');
                    sayacEl.innerText = uzunluk + " / 10";
                    sayacEl.style.color = uzunluk >= 10 ? "#2e7d32" : "#94a3b8";
                });
            }
        });

        async function sifreIslemGonder() {
            let kullaniciAdi = document.getElementById('sifreIslemKullaniciAdi').value.trim();
            let telefon = document.getElementById('sifreIslemTelefon').value.trim();
            let neden = document.getElementById('sifreIslemNeden').value.trim();
            let yeni1 = document.getElementById('sifreIslemYeniSifre1').value;
            let yeni2 = document.getElementById('sifreIslemYeniSifre2').value;
            let mesajDiv = document.getElementById('sifreIslemSonucMesaj');

            if (!kullaniciAdi || !telefon || !neden || !yeni1 || !yeni2) {
                mesajDiv.style.color = "#c62828"; mesajDiv.innerText = "Lütfen tüm alanları doldurun."; return;
            }
            if (neden.length < 10) {
                mesajDiv.style.color = "#c62828"; mesajDiv.innerText = "Açıklama en az 10 karakter olmalı."; return;
            }
            if (yeni1.length < 4) {
                mesajDiv.style.color = "#c62828"; mesajDiv.innerText = "Şifre en az 4 karakter olmalı."; return;
            }
            if (yeni1 !== yeni2) {
                mesajDiv.style.color = "#c62828"; mesajDiv.innerText = "Girdiğiniz yeni şifreler birbiriyle uyuşmuyor."; return;
            }

            let btn = document.getElementById('sifreIslemGonderBtn');
            btn.disabled = true; btn.innerText = "İşleniyor...";
            mesajDiv.style.color = "#333"; mesajDiv.innerText = "Kontrol ediliyor...";

            try {
                let res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "sifreDegistir", ogrenciAdi: kullaniciAdi, telefon: telefon, neden: neden, yeniSifre: yeni1 })
                });
                let data = await res.json();
                if (data.status === "success") {
                    mesajDiv.style.color = "#2e7d32";
                    mesajDiv.innerText = "✅ Şifreniz başarıyla güncellendi! Yeni şifrenizle giriş yapabilirsiniz.";
                    setTimeout(() => { sifreIslemKapat(); }, 2500);
                } else {
                    mesajDiv.style.color = "#c62828";
                    mesajDiv.innerText = "❌ " + (data.message || "Bir hata oluştu.");
                }
            } catch (e) {
                mesajDiv.style.color = "#c62828";
                mesajDiv.innerText = "Bağlantı hatası oluştu.";
            } finally {
                btn.disabled = false; btn.innerText = "Şifreyi Güncelle";
            }
        }
    </script>
</body>
</html>
