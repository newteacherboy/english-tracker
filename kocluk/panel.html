<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eğitim Koçum - Öğrenci Paneli</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #e8f5e9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        h1 { color: #2e7d32; margin: 0; font-size: 24px; }
        .logout-btn {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        .card-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 2px solid #a5d6a7;
        }
        .card h2 { color: #1565c0; margin-top: 0; font-size: 20px; }
        .gorev-item {
            background: #f1f8e9;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            border: 1px solid #c8e6c9;
        }
        .tamamlandi { background: #c8e6c9 !important; text-decoration: line-through; color: #2e7d32; }
        .action-btn {
            background: #ffb300;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
        }
        .action-btn:hover { background: #ffa000; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="karsilamaMesaji">Hoş Geldin!</h1>
        <button class="logout-btn" onclick="cikisYap()">Çıkış Yap 🚪</button>
    </div>

    <div class="card-container">
        <!-- Günlük Görev Kartı -->
        <div class="card">
            <h2>Bugünkü Görevlerim 🎯</h2>
            <div id="gorevlerListesi">Görevler yükleniyor...</div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "BURAYA_GOOGLE_APPS_SCRIPT_URL_YAZIN";
        const ogrenciAdi = localStorage.getItem("aktifOgrenci");

        if (!ogrenciAdi) {
            window.location.href = "index.html";
        } else {
            document.getElementById("karsilamaMesaji").innerText = "Harika Gidiyorsun, " + ogrenciAdi + "! 🌟";
            gorevleriGetir(ogrenciAdi);
        }

        function gorevleriGetir(isim) {
            const listeKutusu = document.getElementById("gorevlerListesi");

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "gorevleriGetir", ogrenciAdi: isim })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success" && data.gorevler.length > 0) {
                    let html = "";
                    data.gorevler.forEach(g => {
                        let bittiMi = g.durum === "Tamamlandı";
                        let sinif = bittiMi ? "gorev-item tamamlandi" : "gorev-item";
                        let butonYazi = bittiMi ? "Harika! ✅" : "Bitti Yap 🚀";
                        let butonTik = bittiMi ? "" : `onclick="gorevBitir('${g.satirId}')"`;
                        
                        html += `
                            <div class="${sinif}">
                                <span>${g.gorevAdi}</span>
                                <button class="action-btn" ${butonTik}>${butonYazi}</button>
                            </div>
                        `;
                    });
                    listeKutusu.innerHTML = html;
                } else {
                    listeKutusu.innerHTML = "<p>Bugün için harika görev bulunmuyor! 🎈</p>";
                }
            })
            .catch(error => {
                listeKutusu.innerHTML = "Görevler yüklenirken hata oluştu.";
            });
        }

        function gorevBitir(id) {
            fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "gorevTamamla", gorevId: id })
            })
            .then(() => {
                gorevleriGetir(ogrenciAdi); // Listeyi yenile
            });
        }

        function cikisYap() {
            localStorage.removeItem("aktifOgrenci");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
