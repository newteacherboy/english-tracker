<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diji-Medu · Yayınlanmamış kayıt önizlemesi</title><link rel="stylesheet" href="first-discovery.css"></head>
<body style="margin:0;font-family:system-ui;background:#e3f2ed">
<div id="previewNotice" style="position:fixed;top:0;left:0;right:0;text-align:center;padding:6px;background:#102d52;color:white;font:11px system-ui;z-index:2147483647">TASLAK ÖNİZLEME · Gerçek kayıt yapılmaz · Örnek bilgiler kullan</div>
<div id="login-container" style="display:none;max-width:400px;margin:70px auto;background:#fffdf3;padding:25px;border-radius:25px"><h1>Hoş geldin</h1><p>Bu dosya giriş ekranının bağlantısını gösterir. Gerçek giriş yapılmaz.</p><input id="ogrenci" placeholder="Kullanıcı adı"><button onclick="location.reload()">Önizlemeyi baştan aç</button></div>
<script>
(()=>{
 const store=()=>{const data=new Map();return {getItem:k=>data.get(k)||null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)};};
 const raw=store(),session=store();let emailVerified=false;
 window.dmDiscoveryContext={raw,session,member:false,guest:false,oauth:false,welcome:true,
  googleAvailable:async()=>false,
  request:async body=>{
   if(body.islem==='googleDurum')return {hazir:false};
   if(body.islem==='kayitOl')return {status:'success',token:'PREVIEW_ONLY_NOT_A_REAL_TOKEN',ogrenci:body.ogrenciAdi,mailQueued:true};
   if(body.islem==='ogretmenKayitOl')return {ok:true,onayBekliyor:true};
   if(body.islem==='memberStatus'){emailVerified=true;return {ok:true,emailVerified};}
   if(body.islem==='memberEmailResend')return {ok:true,mesaj:'Önizleme: gerçek e-posta gönderilmedi.'};
   if(body.islem==='ekVeriGetir')return null;
   if(body.islem==='ekVeriKaydet')return {status:'success'};
   throw Error('Önizleme: bu işlem kullanılamaz.');
  },
  navigate:url=>{
   if(url.includes('misafir=1')){window.dmDiscoveryContext.guest=true;window.dmDiscoveryContext.welcome=false;window.dmFirstDiscovery.showHome();}
   else if(url.includes('preview-complete')){document.getElementById('previewNotice').textContent='ÖNİZLEME TAMAMLANDI · Gerçek hesap oluşturulmadı';window.dmFirstDiscovery.showHome();}
   else {document.getElementById('login-container').style.display='block';}
  }
 };
 window.aktivitelerTamEkranAc=()=>window.dmFirstDiscovery.invite();
 window.sanaOzelTamEkranAc=()=>window.dmFirstDiscovery.invite();
 window.profilAc=()=>window.dmFirstDiscovery.openRegistration();
})();
</script><script src="first-discovery.js"></script>
</body></html>
