<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diji-Medu Öğrenme Haritası Kontrolü</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="experience-ui.css?v=1"><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#faf8ff;font-family:Nunito,system-ui;color:#20546a}.note{font-size:10px;color:#7d8195}button{cursor:pointer}button:focus-visible{outline:3px solid #d49e36;outline-offset:3px}.ma-kap{border-radius:26px;overflow:hidden}.ma-ust{display:flex}.ma-rozet{margin-left:auto;padding:6px 10px;border-radius:20px}.ma-alt{text-align:center;padding:14px}.ma-klasik{border:1px solid #e4e8f2;padding:8px 14px;border-radius:16px}.ma-ada{border:0;background:none}.ma-isim small,.ma-isim i{display:block}.qa-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.qa-toolbar button{background:#fff;border:1px solid #d9e9e5;border-radius:10px;padding:8px;color:#235d6b;font-family:inherit}#bzAlan{padding:20px;background:#ede8fd;border-radius:22px}#maAdaIc .ma-yapi{border:0}#maAdaIc .ma-yapi .et,#maAdaIc .ma-yapi .ev,#maAdaIc .ma-yapi small{display:block}.cubuk{height:5px;background:#e8f2f1;border-radius:6px;overflow:hidden;margin-top:8px}.cubuk i{display:block;height:100%;background:#30b598}.akis-ust{display:flex;align-items:center;gap:8px}.av{border-radius:50%;background:#d8eef4;padding:10px}.dm-online-badge{background:#e6fbf0;color:#217549;padding:4px 7px;border-radius:20px}.dm-feed-name b{font-size:14px}.dm-feed-name small{color:#8990a7}</style><body class="dc-ada"><p class="note">Örnek veriler · Tasarım kontrolü</p><div id="panel-alani"><div id="tab-derscalis"><div id="maHarita" class="ma-kap ma-deniz"><div class="ma-ust"><span class="ma-tabela">İngilizce Adaları</span><span class="ma-rozet">⭐ 1</span></div><div class="ma-harita">
<button class="ma-ada" data-s="A1" aria-label="A1 Başlangıç adası, yüzde 2"><svg></svg><span class="ma-isim"><b>A1</b><small>Başlangıç · %2</small><i>⭐☆☆</i></span></button><button class="ma-ada" data-s="A2" aria-label="A2 Temel adası, yüzde 0"><svg></svg><span class="ma-isim"><b>A2</b><small>Temel · %0</small><i>🌱 Yeni</i></span></button><button class="ma-ada" data-s="B1" aria-label="B1 Orta adası, yüzde 0"><svg></svg><span class="ma-isim"><b>B1</b><small>Orta · %0</small><i>🌱 Yeni</i></span></button><button class="ma-ada" data-s="B2" aria-label="B2 Orta-Üst adası, yüzde 0"><svg></svg><span class="ma-isim"><b>B2</b><small>Orta-Üst · %0</small><i>🌱 Yeni</i></span></button></div><div class="ma-alt"><button class="ma-klasik">Klasik görünüm</button></div></div>
<div id="maAdaIc" class="ma-kap" style="display:none"><div class="ma-ust"><span class="ma-tabela">A1 Adası<small>Başlangıç · %2 keşfedildi</small></span></div><button class="ma-yapi"><span class="ev">📚</span><span class="et">Dil Bilgisi<small>1/22 konu</small><div class="cubuk"><i style="width:5%"></i></div></span></button><button class="ma-yapi"><span class="ev">🔤</span><span class="et">Kelime<small>0/12 konu</small></span></button><button class="ma-yapi"><span class="ev">💬</span><span class="et">İletişim<small>0/9 konu</small></span></button><button class="ma-yapi"><span class="ev">🎧</span><span class="et">Telaffuz<small>0/3 konu</small></span></button></div></div>
<div class="qa-toolbar"><button id="qaMap">Harita</button><button id="qaCats">A1 kategorileri</button><button id="qaMusic">Parkur müziğini dene</button><button id="qaNudge">7 saniyelik duyuru</button></div><div id="bzAlan" style="display:none"><h3>Örnek parkur sorusu</h3><p>apple ne demek?</p><button id="qaCorrect">Elma · Doğru</button><button id="qaWrong">Kitap · Yanlış</button><button id="qaStop">Parkuru kapat</button></div><div id="headerEnerjiNum" hidden>7/30</div><div id="tab-meduakis"><div class="akis-ust"><span class="av">👤<span class="dm-online-badge" data-online-person="Ayşe">Çevrimiçi</span></span><span><b>Ayşe Yılmaz</b><small>2 dakika önce</small></span></div></div><p id="qaState" role="status"></p></div>
<script>window.aktifOgrenciAdi='Örnek öğrenci';window.genelSesEfektiCal=()=>{};window.dmFeatureEnabled=()=>true;window.dersCalisTamEkranAc=()=>document.getElementById('qaState').textContent='Ders Çalış açıldı';document.querySelectorAll('.ma-ada').forEach(b=>b.onclick=()=>{document.getElementById('maAdaIc').style.display='grid';document.getElementById('maHarita').style.display='none';document.querySelector('#maAdaIc .ma-tabela').firstChild.textContent=b.dataset.s+' Adası';});</script><script src="experience-ui.js?v=2"></script><script>const E=id=>document.getElementById(id);E('qaMap').onclick=()=>{E('maHarita').style.display='block';E('maAdaIc').style.display='none';};E('qaCats').onclick=()=>document.querySelector('.ma-ada').click();E('qaMusic').onclick=()=>{E('bzAlan').style.display='block';E('qaState').textContent='Parkur açık · müzik tercihini sağ üstte değiştirebilirsin';};E('qaStop').onclick=()=>{E('bzAlan').style.display='none';E('qaState').textContent='Parkur kapandı';};E('qaCorrect').onclick=()=>genelSesEfektiCal('dogru');E('qaWrong').onclick=()=>genelSesEfektiCal('yanlis');E('qaNudge').onclick=()=>dmNudgeSystem.showPreview({id:'qa',target:'ders',flag:'ders',title:'Enerjin azalıyor, öğrenmen devam etsin!',text:'Konu çalışarak tekrar yapabilir ve uygun tamamlamalarda enerji kazanabilirsin.'});</script></body></html>
