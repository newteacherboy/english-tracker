<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Hoş geldin · Diji-Medu</title><link rel="icon" href="ingilizce-icon-192.png"><style>[hidden]{display:none!important}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#dff5ee,#ede4ff);font:17px system-ui;color:#245447}.card{box-sizing:border-box;width:min(92vw,460px);padding:28px;background:#fff;border:3px solid #b9dccb;border-radius:32px;text-align:center;box-shadow:0 20px 60px #33665022}img{width:125px;height:150px;object-fit:contain}button,a{display:block;margin:15px auto;padding:15px;border:0;border-radius:16px;background:#347b62;color:#fff;font:800 16px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}</style><main class="card"><img src="mascot-reward.webp" alt="Papi seni karşılıyor"><h1>Diji-Medu’ya hoş geldin!</h1><p id="status" role="status">Papi ile İngilizce yolculuğuna hazırsın. E-posta adresini doğrulayarak üyeliğini tamamla.</p><button id="verify">Üyeliğimi tamamla 🦜</button><a href="./" id="login" hidden>Giriş ekranına git</a></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';history.replaceState(null,'',location.pathname);const b=document.getElementById('verify'),s=document.getElementById('status');if(!token){s.textContent='Doğrulama bağlantısı eksik. E-postandaki bağlantıyı yeniden aç.';b.hidden=true;document.getElementById('login').hidden=false;}b.onclick=async()=>{b.disabled=true;s.textContent='Hesabın doğrulanıyor…';try{const r=await fetch('https://nxfqlutulxqzqgwewssd.supabase.co/functions/v1/diji-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({islem:'emailDogrula',token})});const d=await r.json();s.textContent=d.mesaj||'Doğrulama tamamlanamadı.';b.hidden=true;document.getElementById('login').hidden=false;}catch(e){s.textContent='Bağlantı kurulamadı. Düğmeye yeniden dokun.';b.disabled=false;}};
</script></html>
