<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Soru tasarımları kontrolü</title><style>
.bz-parkur{position:absolute;inset:0;overflow-y:auto;background:#1e1446;color:#fff;font-family:Nunito,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);-webkit-overflow-scrolling:touch}
.bz-parkur .bz-ic{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.bz-parkur.pk-var .bz-ic{padding-top:calc(var(--pk-h,56px) + 8px)}   /* parkurlar arası geçiş şeridinin altında kalmasın */
#tab-dunya.bz-yeni #dunyaAlan{display:none!important}
#tab-dunya:not(.bz-yeni) .bz-parkur{display:none!important}
.bz-ust-btn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 12px;font-family:inherit;font-weight:900;font-size:13px;cursor:pointer;white-space:nowrap}
.bz-ust-btn:focus-visible{outline:3px solid #fde68a;outline-offset:2px}
.bz-yeni-don{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99995;border:0;border-radius:999px;padding:10px 16px;font-family:Nunito,system-ui,sans-serif;font-weight:900;font-size:13px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#db2777);box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.bz-sinif-etiket{position:absolute;left:10px;z-index:1;background:#fde68a;color:#78350f;border-radius:999px;padding:5px 12px;font-weight:900;font-size:12.5px;box-shadow:0 3px 0 #b45309;white-space:nowrap}
.bz-govde{padding-bottom:6px}
.bz-oyun .bz-govde{flex:none}
.bz-oyun{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#bzAlan{background:#fff;color:#2d2350;border-radius:24px;padding:18px 16px;box-shadow:0 12px 32px rgba(0,0,0,.28);margin:2px 14px 0;max-width:532px}
@media (min-width:561px){#bzAlan{margin:2px auto 0}}
:is(#bzAlan,.bz-inceleme-govde) .bz-soru{color:#1e1b4b;margin-top:0}
:is(#bzAlan,.bz-inceleme-govde) .bz-ipucu{color:#4c1d95!important;background:#f5f3ff;border-radius:14px;padding:10px 12px;font-size:14px!important;font-weight:800;margin:0 0 14px;line-height:1.45}
:is(#bzAlan,.bz-inceleme-govde) .bz-ipucu b{color:#7c3aed}
:is(#bzAlan,.bz-inceleme-govde) small{color:#6d28d9!important}
:is(#bzAlan,.bz-inceleme-govde) .bz-sec{border:2px solid #ddd6fe;box-shadow:0 4px 0 #c4b5fd}
:is(#bzAlan,.bz-inceleme-govde) .bz-sec:disabled:not(.dogru):not(.yanlis){opacity:.35;text-decoration:line-through}
:is(#bzAlan,.bz-inceleme-govde) .bz-slot{background:#f5f3ff;border-color:#a78bfa;color:#4c1d95}
:is(#bzAlan,.bz-inceleme-govde) .bz-slot.sabit{background:#ede9fe;color:#4c1d95}
:is(#bzAlan,.bz-inceleme-govde) .bz-slot.dolu{background:#fde68a;color:#78350f}
:is(#bzAlan,.bz-inceleme-govde) .bz-cip2{border:2px solid #ddd6fe;box-shadow:0 3px 0 #c4b5fd}
:is(#bzAlan,.bz-inceleme-govde) .bz-cevap{background:#f5f3ff;border:2px dashed #a78bfa;min-height:64px;align-items:center}
:is(#bzAlan,.bz-inceleme-govde) .bz-wordle .h{background:#ede9fe;color:#1e1b4b}
:is(#bzAlan,.bz-inceleme-govde) .bz-wordle .h.g,:is(#bzAlan,.bz-inceleme-govde) .bz-wordle .h.s,:is(#bzAlan,.bz-inceleme-govde) .bz-wordle .h.x{color:#fff}
:is(#bzAlan,.bz-inceleme-govde) .bz-asma{color:#1e1b4b}
:is(#bzAlan,.bz-inceleme-govde) .bz-sure{background:#ede9fe}
:is(#bzAlan,.bz-inceleme-govde) .bz-input{border:2px solid #ddd6fe;background:#faf5ff;color:#1e1b4b}
.bz-etiket{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#7c3aed;margin:2px 0 6px;letter-spacing:.2px}
.bz-bos-vagon{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:12px;border:2px dashed #c4b5fd;color:#a78bfa;font-weight:900;font-size:14px;background:#fff}
.bz-tr-anlam{font-size:13px;font-weight:800;color:#6d28d9;margin:-8px 0 12px}
/* jokerler */
.bz-jokerler{display:flex;gap:6px;align-items:stretch;margin:12px 14px 0;max-width:532px;flex-wrap:wrap}
@media (min-width:561px){.bz-jokerler{margin:12px auto 0}}
.bz-jk{flex:1;min-width:64px;border:0;border-radius:14px;padding:7px 4px;background:rgba(255,255,255,.12);color:#fff;font-family:inherit;font-weight:900;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;border:1px solid rgba(255,255,255,.18)}
.bz-jk span{font-size:20px;line-height:1}
.bz-jk b{position:absolute;top:-6px;right:-4px;background:#fbbf24;color:#78350f;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px}
.bz-jk:disabled{opacity:.35;cursor:default}
.bz-jk.al{flex:0 0 auto;min-width:58px;background:linear-gradient(135deg,#f59e0b,#ea580c);border:0}
.bz-jk:focus-visible{outline:3px solid #fde68a;outline-offset:2px}
/* inceleme (geri) */
.bz-inceleme{margin:2px 14px 0;max-width:532px}
@media (min-width:561px){.bz-inceleme{margin:2px auto 0}}
.bz-inceleme-bas{display:flex;align-items:center;gap:8px;background:#fde68a;color:#78350f;border-radius:16px 16px 0 0;padding:9px 12px;font-weight:900;font-size:13px}
.bz-inceleme-bas button{border:0;border-radius:10px;background:#fff;color:#78350f;font-family:inherit;font-weight:900;font-size:13px;padding:6px 10px;cursor:pointer}
.bz-inceleme-bas button:disabled{opacity:.4;cursor:default}
.bz-inceleme-govde{background:#fff;color:#2d2350;border-radius:0 0 24px 24px;padding:16px;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.bz-inceleme-govde .bz-btn{display:none}
.bz-enerji-pill{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 9px;font-weight:900;font-size:12px;white-space:nowrap}
.bz-geri-soru{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:900;font-size:16px;cursor:pointer;flex:none}
.bz-geri-soru:disabled{opacity:.3;cursor:default}
.bz-alt-kart .ek-parkur-not{display:none!important}
.bz-panel{position:fixed;inset:0;z-index:100000048;background:rgba(10,5,30,.65);display:flex;align-items:center;justify-content:center;padding:16px}
.bz-panel-kart{background:#fff;color:#2d2350;border-radius:22px;padding:18px;max-width:360px;width:100%;text-align:center;font-family:Nunito,system-ui,sans-serif}
.bz-panel-kart h3{margin:4px 0 6px;font-size:18px;font-weight:900}
.bz-panel-kart p{margin:0 0 14px;font-size:13px;font-weight:700;color:#6b5b95}
.bz-dukkan{display:grid;gap:8px;text-align:left;margin-bottom:12px}
.bz-dukkan div{display:flex;align-items:center;gap:10px;border:2px solid #ede9fe;border-radius:14px;padding:8px 10px;font-size:13px;font-weight:800}
.bz-dukkan div span.e{font-size:24px}
.bz-dukkan div small{display:block;color:#7c6ba8;font-weight:700}
.bz-dukkan div button{margin-left:auto;border:0;border-radius:10px;padding:8px 10px;font-family:inherit;font-weight:900;font-size:12.5px;color:#fff;background:linear-gradient(135deg,#f59e0b,#ea580c);cursor:pointer;white-space:nowrap}
.bz-perde{position:fixed;inset:0;z-index:100000040;overflow-y:auto;background:#1e1446;color:#fff;font-family:Nunito,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bz-ic{max-width:560px;margin:0 auto;padding:10px 12px 28px}
.bz-bas{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bz-bas .kapat{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;font-weight:900;cursor:pointer;flex:none}
.bz-profil{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:5px 10px 5px 5px;min-width:0}
.bz-profil .av{width:38px;height:38px;border-radius:12px;background:#fde68a;display:grid;place-items:center;font-size:22px;overflow:hidden;flex:none}
.bz-profil .av svg{width:100%;height:100%}
.bz-profil b{display:block;font-size:13.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz-profil small{font-size:11px;font-weight:800;color:#fde68a}
.bz-cip{margin-left:auto;display:flex;gap:6px}
.bz-cip span{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 10px;font-weight:900;font-size:12.5px;white-space:nowrap}
.bz-afis{text-align:center;margin:6px auto 14px;background:linear-gradient(135deg,#6d28d9,#a855f7);border:3px solid #fbbf24;border-radius:18px;padding:8px 16px;width:max-content;max-width:100%;box-shadow:0 0 30px rgba(168,85,247,.5)}
.bz-afis b{display:block;font-size:19px;font-weight:900;color:#fde68a;text-shadow:0 2px 0 #4c1d95}
.bz-afis small{font-size:12px;font-weight:800;color:#e9d5ff}
button.bz-kapi,.bz-tas,.bz-btn,.bz-sec,.bz-cip2,.bz-kart2{font-family:inherit}
/* ---- Koridor ---- */
.bz-koridor{position:relative;border-radius:26px;padding:18px 12px 14px;background:radial-gradient(ellipse at 50% 0%,#f59e0b44,transparent 60%),linear-gradient(180deg,#3b2a1a,#2a1d12 40%,#1c130c);border:2px solid #5b3a1e;box-shadow:inset 0 0 60px rgba(0,0,0,.5)}
.bz-mesale{position:absolute;top:18px;font-size:24px;animation:bzTitre 1.6s ease-in-out infinite}
.bz-kapilar{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.bz-kapi{position:relative;border:0;cursor:pointer;color:#fff;border-radius:80px 80px 14px 14px;padding:22px 10px 14px;min-height:190px;text-align:center;box-shadow:inset 0 0 0 5px rgba(0,0,0,.25),0 0 26px var(--isik);transition:transform .2s}
.bz-kapi:hover,.bz-kapi:focus-visible{transform:translateY(-3px)}
.bz-kapi:focus-visible{outline:3px solid #fde68a;outline-offset:3px}
.bz-kapi .no{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 8px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.55);font-size:22px;font-weight:900}
.bz-kapi b{display:block;font-size:15px;font-weight:900;line-height:1.2}
.bz-kapi small{display:block;font-size:11.5px;font-weight:800;opacity:.9;margin-top:3px}
.bz-kapi .yil{margin-top:8px;font-size:12.5px;font-weight:900;background:rgba(0,0,0,.25);border-radius:999px;display:inline-block;padding:3px 10px}
.bz-kapi.kilit{filter:grayscale(.7) brightness(.7)}
.bz-kapi.kilit .no{font-size:20px}
.bz-kitap{display:flex;gap:10px;align-items:center;margin-top:16px;background:#fef3c7;color:#78350f;border-radius:16px;padding:10px 12px;font-weight:800;font-size:13px;box-shadow:0 4px 0 #b45309}
.bz-kitap span{font-size:30px}
.bz-eski{display:block;margin:14px auto 0;border:0;background:none;color:#c4b5fd;font-weight:800;font-size:12px;cursor:pointer;text-decoration:underline}
/* ---- Kale haritası ---- */
.bz-geri{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 12px;font-weight:900;font-size:13px;cursor:pointer}
.bz-harita{position:relative;height:600px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#312e81 0%,#7c3aed 38%,#f0abfc 62%,#86efac 63%,#22c55e 100%)}
.bz-harita .bulut{position:absolute;font-size:30px;opacity:.85;animation:bzSuz 5s ease-in-out infinite}
.bz-kale{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:230px}
.bz-yol{position:absolute;inset:0;width:100%;height:100%}
.bz-tas{position:absolute;transform:translate(-50%,-50%);border:0;cursor:pointer;width:52px;height:46px;border-radius:50%;font-weight:900;font-size:17px;display:grid;place-items:center;color:#4c1d95;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .15s}
.bz-tas:hover,.bz-tas:focus-visible{transform:translate(-50%,-50%) scale(1.1)}
.bz-tas:focus-visible{outline:3px solid #fde68a;outline-offset:3px}
.bz-tas .y{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;letter-spacing:-1px}
.bz-tas.sonraki{animation:bzNabiz 1.4s ease-in-out infinite}
.bz-kahraman{position:absolute;width:62px;height:62px;transform:translate(-50%,-100%);pointer-events:none;animation:bzSuz 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.bz-kahraman svg{width:100%;height:100%;border-radius:50%}
.bz-tabela{position:absolute;right:10px;bottom:12px;background:#fef3c7;color:#78350f;border:3px solid #92400e;border-radius:12px;padding:6px 10px;font-weight:900;font-size:12px;transform:rotate(-3deg);box-shadow:0 4px 0 #92400e}
.bz-yan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bz-kutu{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:12px}
.bz-kutu h4{margin:0 0 8px;font-size:13.5px;font-weight:900;display:flex;gap:6px;align-items:center}
.bz-kutu .gorev{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800;margin:5px 0}
.bz-cubuk{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:6px}
.bz-cubuk i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f472b6);border-radius:99px}
.bz-sandik{display:flex;gap:8px;align-items:center}
.bz-sandik span{font-size:30px}
.bz-btn{border:0;border-radius:14px;padding:12px;font-weight:900;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#f59e0b,#ea580c);box-shadow:0 4px 0 #9a3412;width:100%}
.bz-btn:disabled{background:rgba(255,255,255,.18);box-shadow:none;color:#c4b5fd;cursor:default}
.bz-btn.mor{background:linear-gradient(135deg,#8b5cf6,#db2777);box-shadow:0 4px 0 #6d28d9}
.bz-btn:focus-visible,.bz-sec:focus-visible,.bz-cip2:focus-visible,.bz-kart2:focus-visible{outline:3px solid #fde68a;outline-offset:2px}
/* ---- Durak kartı ---- */
.bz-alt{position:fixed;inset:0;z-index:100000045;background:rgba(10,5,30,.6);display:flex;align-items:flex-end;justify-content:center;animation:bzGel .2s}
.bz-alt-kart{background:#fff;color:#2d2350;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:bzYuk .3s cubic-bezier(.2,.9,.3,1.1)}
.bz-alt-kart h3{margin:0;font-size:20px;font-weight:900}
.bz-alt-kart .alt{color:#7c6ba8;font-weight:800;font-size:12.5px;margin:2px 0 12px}
.bz-tipler{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.bz-tipler div{background:#f5f3ff;border-radius:12px;padding:7px 3px;text-align:center;font-size:10.5px;font-weight:800;color:#5b21b6;line-height:1.2}
.bz-tipler div span{display:block;font-size:20px}
/* ---- Oyun ---- */
.bz-oyun{min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#7c3aed55,transparent 60%),#1e1446}
.bz-oyun-ust{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;max-width:560px;width:100%;margin:0 auto}
.bz-noktalar{flex:1;display:flex;gap:4px}
.bz-noktalar i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.18)}
.bz-noktalar i.d{background:#22c55e}.bz-noktalar i.y{background:#ef4444}.bz-noktalar i.a{background:#fbbf24}
.bz-govde{flex:1;max-width:560px;width:100%;margin:0 auto;padding:6px 14px 16px}
.bz-tip{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-weight:900;font-size:12.5px;margin-bottom:10px}
.bz-soru{font-size:clamp(20px,6vw,28px);font-weight:900;margin:4px 0 6px;line-height:1.25;overflow-wrap:anywhere}
.bz-ipucu{color:#c4b5fd;font-weight:800;font-size:13.5px;margin-bottom:14px}
.bz-secenekler{display:grid;gap:9px}
.bz-sec{border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;background:#fff;color:#2d2350;text-align:left;cursor:pointer;box-shadow:0 4px 0 #a78bfa}
.bz-sec.dogru{background:#bbf7d0;box-shadow:0 4px 0 #16a34a}.bz-sec.yanlis{background:#fecaca;box-shadow:0 4px 0 #dc2626}
.bz-sec:disabled{cursor:default}
.bz-ses{border:0;border-radius:14px;background:#fbbf24;color:#78350f;font-weight:900;font-size:15px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 #b45309}
.bz-slotlar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.bz-slot{width:40px;height:48px;border-radius:12px;background:rgba(255,255,255,.14);border:2px dashed rgba(255,255,255,.35);display:grid;place-items:center;font-size:22px;font-weight:900;text-transform:uppercase}
.bz-slot.sabit{background:#fff;color:#4c1d95;border:0}
.bz-slot.dolu{background:#fde68a;color:#78350f;border:0;cursor:pointer}
.bz-harfler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bz-cip2{border:0;border-radius:12px;background:#fff;color:#4c1d95;font-weight:900;font-size:17px;min-width:42px;height:44px;padding:0 10px;cursor:pointer;box-shadow:0 3px 0 #a78bfa;text-transform:uppercase}
.bz-cip2:disabled{opacity:.35;cursor:default}
.bz-cip2.bos{visibility:hidden}
.bz-cip2.iyi{background:#bbf7d0;box-shadow:0 3px 0 #16a34a}.bz-cip2.kotu{background:#fecaca;box-shadow:0 3px 0 #dc2626}
.bz-kartlar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bz-kart2{border:0;border-radius:14px;height:78px;font-weight:900;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 4px 0 #4c1d95;padding:4px;overflow-wrap:anywhere}
.bz-kart2.acik{background:#fff;color:#2d2350;box-shadow:0 4px 0 #a78bfa}
.bz-kart2.tamam{background:#bbf7d0;color:#14532d;box-shadow:none;pointer-events:none}
.bz-es{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bz-es div{display:flex;flex-direction:column;gap:8px}
.bz-es .bz-cip2{text-transform:none;font-size:14.5px;height:auto;min-height:46px;padding:6px}
.bz-es .bz-cip2.secili{outline:3px solid #fbbf24}
.bz-es .bz-cip2.tamam{background:#bbf7d0;box-shadow:none;pointer-events:none;opacity:.7}
.bz-cevap{min-height:58px;display:flex;flex-wrap:wrap;gap:6px;padding:8px;margin-bottom:14px;border-radius:14px;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.25)}
.bz-cevap .bz-cip2,.bz-tren-havuz .bz-cip2{text-transform:none;font-size:15px}
.bz-tren-havuz{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bz-sure{height:10px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-bottom:14px}
.bz-sure i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#fbbf24,#ef4444);transition:width linear}
.bz-wordle{display:grid;gap:5px;justify-content:center;margin-bottom:12px}
.bz-wordle .satir{display:flex;gap:5px}
.bz-wordle .h{width:44px;height:46px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:900;font-size:21px;text-transform:uppercase}
.bz-wordle .h.g{background:#22c55e}.bz-wordle .h.s{background:#eab308}.bz-wordle .h.x{background:#475569}
.bz-klavye{display:grid;gap:5px}
.bz-klavye div{display:flex;gap:4px;justify-content:center}
.bz-klavye .bz-cip2{min-width:28px;height:42px;padding:0 6px;font-size:15px}
.bz-input{width:100%;border:0;border-radius:14px;padding:14px;font-family:inherit;font-weight:900;font-size:20px;text-align:center;margin:10px 0 12px;text-transform:lowercase}
.bz-geri-bildirim{border-radius:16px;padding:12px 14px;margin-top:14px;font-weight:800;font-size:15px}
