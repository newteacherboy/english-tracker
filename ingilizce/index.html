<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Giriş Portalı - Öğretmen Çocuk</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f7f5f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        /* Sol üst ana portal dönüş linki */
        .ana-sayfa-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            text-decoration: none;
            color: #4b6b4b;
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }
        .ana-sayfa-btn:hover {
            background: #4b6b4b;
            color: #ffffff;
        }
        /* Giriş Kartı */
        .login-card {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }
        h2 {
            color: #2d3748;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #718096;
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background-color: #edf2f7;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            background-color: #fff;
            border-color: #38a169;
            box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.1);
        }
        .btn-giris {
            width: 100%;
            padding: 12px;
            background-color: #2f855a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .btn-giris:hover {
            background-color: #276749;
        }
        .btn-giris:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        #mesaj {
            margin-top: 15px;
            font-size: 13px;
            min-height: 20px;
        }
        .error { color: #e53e3e; }
        .success { color: #38a169; }
        
        /* Veri Paneli Alanı (Başarılı Giriş Sonrası Görünecek Kısım) */
        #panel-alani {
            display: none;
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Sol Üst Ana Sayfa Linki -->
    <a href="https://panel.ogretmencocuk.com" class="ana-sayfa-btn">← Ana Portala Dön</a>

    <!-- Giriş Formu Kutusu -->
    <div class="login-card" id="login-container">
        <div class="logo-icon">🎓</div>
        <h2>Öğrenci Giriş Portalı</h2>
        <p class="subtitle">Lütfen sistemde kayıtlı şifrenizi ve telefon numaranızı giriniz.</p>
        
        <form id="loginForm" onsubmit="girisYap(event)">
            <div class="form-group">
                <input type="password" id="ogrencisifre" placeholder="Öğrenci Şifreniz" required autocomplete="current-password">
            </div>
            <div class="form-group">
                <input type="text" id="telefon" placeholder="Telefon Numaranız" required autocomplete="tel">
            </div>
            <button type="submit" id="girisBtn" class="btn-giris">Giriş Yap</button>
        </form>
        <div id="mesaj"></div>
    </div>

    <!-- Başarılı Giriş Sonrası Panel İçeriği -->
    <div id="panel-alani">
        <h2>Hoş Geldiniz! Panel Verileriniz</h2>
        <p style="color: #718096; margin-top: 10px; margin-bottom: 20px;">Google Sheets üzerinden güvenli şekilde çekilen oturum bilgileriniz:</p>
        <div id="veri-detay">Yükleniyor...</div>
        <button onclick="cikisYap()" class="btn-giris" style="max-width: 150px; margin-top: 20px; background-color: #e53e3e;">Çıkış Yap</button>
    </div>

    <script>
        // Google Apps Script Web App Linkiniz
        const apiURL = "https://script.google.com/macros/s/AKfycbwieIsbD497puIgT73vkAk1-trZSPMNghAmilVHnS3j2ZzfMtrSNw3Qn4x56a8EKh5z/exec";
        
        let hataliDenemeSayisi = 0;
        const MAX_DENEME = 3;

        // XSS / Güvenlik için girdi temizleme fonksiyonu
        function guvenliMetin(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        async function girisYap(event) {
            event.preventDefault();
            
            const sifreInput = document.getElementById('ogrencisifre').value.trim();
            const telefonInput = document.getElementById('telefon').value.trim();
            const mesajDiv = document.getElementById('mesaj');
            const girisBtn = document.getElementById('girisBtn');

            // Basit Doğrulama ve Temizleme
            const sifre = guvenliMetin(sifreInput);
            const telefon = guvenliMetin(telefonInput);

            if (!sifre || !telefon) {
                mesajDiv.className = "error";
                mesajDiv.innerText = "Lütfen tüm alanları doldurunuz.";
                return;
            }

            mesajDiv.className = "";
            mesajDiv.innerText = "Veriler kontrol ediliyor, lütfen bekleyin...";
            girisBtn.disabled = true;

            try {
                const response = await fetch(apiURL);
                const data = await response.json();

                // Google Sheets'ten gelen veriler içinde eşleşme arama
                // Sütunlar: tarih, oturum_saniye, ogrencisifre, telefon
                let kullaniciBulundu = data.find(item => 
                    String(item.ogrencisifre).trim() === sifre && 
                    String(item.telefon).trim() === telefon
                );

                if (kullaniciBulundu) {
                    // Başarılı Giriş
                    mesajDiv.className = "success";
                    mesajDiv.innerText = "Giriş başarılı! Yönlendiriliyorsunuz...";
                    
                    // Oturum bilgisini tarayıcı güvenli belleğine al
                    sessionStorage.setItem("oturumAcik", "true");
                    sessionStorage.setItem("ogrenciTelefon", telefon);

                    setTimeout(() => {
                        document.getElementById('login-container').style.display = 'none';
                        document.getElementById('panel-alani').style.display = 'block';
                        paneliDoldur(kullaniciBulundu);
                    }, 1000);

                } else {
                    // Hatalı Giriş
                    hataliDenemeSayisi++;
                    girisBtn.disabled = false;
                    
                    if (hataliDenemeSayisi >= MAX_DENEME) {
                        mesajDiv.className = "error";
                        mesajDiv.innerText = "Çok fazla hatalı giriş yaptınız. 30 saniye engellendiniz.";
                        girisBtn.disabled = true;
                        setTimeout(() => {
                            hataliDenemeSayisi = 0;
                            girisBtn.disabled = false;
                            mesajDiv.innerText = "";
                        }, 30000);
                    } else {
                        mesajDiv.className = "error";
                        mesajDiv.innerText = `Hatalı şifre veya telefon! Kalan hakkınız: ${MAX_DENEME - hataliDenemeSayisi}`;
                    }
                }

            } catch (error) {
                console.error("Bağlantı hatası:", error);
                mesajDiv.className = "error";
                mesajDiv.innerText = "Sunucu bağlantısında bir sorun oluştu.";
                girisBtn.disabled = false;
            }
        }

        function paneliDoldur(kullanici) {
            const detayDiv = document.getElementById('veri-detay');
            detayDiv.innerHTML = `
                <div style="background: #f7f9fc; padding: 15px; border-radius: 8px; border-left: 4px solid #38a169;">
                    <p><strong>Kayıt Tarihi:</strong> ${kullanici.tarih || 'Belirtilmemiş'}</p>
                    <p><strong>Oturum Süresi (Saniye):</strong> ${kullanici.oturum_saniye || 'Belirtilmemiş'}</p>
                    <p><strong>Telefon:</strong> ${kullanici.telefon || 'Belirtilmemiş'}</p>
                </div>
            `;
        }

        function cikisYap() {
            sessionStorage.clear();
            window.location.reload();
        }
    </script>
</body>
</html>
