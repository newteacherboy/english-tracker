<!doctype html><html lang="tr"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aktivite tasarım önizlemesi</title><link rel="stylesheet" href="activity-preview-base.css"><link rel="stylesheet" href="parkur-theme.css?v=3"><link rel="stylesheet" href="medupro.css?v=1"><link rel="stylesheet" href="activity-ui.css?v=2"><style>body{display:block!important;min-height:0!important;margin:0;background:#effaf6;font-family:Nunito,system-ui}#tab-aktiviteler{position:relative;inset:auto;display:block!important;min-height:100vh;overflow:visible!important;transform:none!important;opacity:1!important}#tab-aktiviteler .dc-focus-card{margin:auto;overflow:visible!important;max-height:none!important}#tab-meduakis{position:relative;display:none}#bottomNavMobile{display:flex!important}#fixture-toolbar{position:relative;z-index:20;display:flex;gap:8px;padding:8px;background:white}#fixture-toolbar button{padding:8px;border:1px solid #d3e9e5;border-radius:8px}.dm-parkur-head{max-width:520px;margin:auto}#pkSekmeler{display:none!important}</style><body><div id="fixture-toolbar"><button onclick="showDemo('activity')">Aktivite</button><button onclick="showDemo('tabs')">Sekmeler</button><button onclick="showDemo('profile')">Profil</button><small>Örnek veriler · kayıt yapılmaz</small></div><div id="fixture-tabs" hidden></div><div id="tab-aktiviteler" class="active"><div class="dc-focus-card"><div class="az-grid2x2"><button class="az-gcard" id="kelimeYarismasiAc" onclick="kelimeYarismasiAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Kelime Laboratuvarı</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="jpOyunAc" onclick="jpOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Risk Balonları</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="boslukOyunAc" onclick="boslukOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Eksik Harf</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="hafizaOyunAc" onclick="hafizaOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Hafıza Sandığı</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="esOyunAc" onclick="esOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Eş Bul</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="trenOyunAc" onclick="trenOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Kelime Treni</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="yagmurOyunAc" onclick="yagmurOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Hız Fırtınası</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="asmacaOyunAc" onclick="asmacaOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Harf Avı</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="kelimebulOyunAc" onclick="kelimebulOyunAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Şifre Kırıcı</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="yoDikteKart" onclick="dikteAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Kulak Dedektifi</div><div class="ak-etiket">8 soru · 3 ⚡</div></button><button class="az-gcard" id="cumleAc" onclick="cumleAc()"><div class="az-gcard-icon">🎮</div><div class="az-gcard-title">Cümle Ustası</div><div class="ak-etiket">8 soru · 3 ⚡</div></button></div></div></div><div id="tab-meduakis"><div id="maDemoProfile"></div></div><div id="pkSekmeler"><button data-p="ba">Parkur</button></div><div class="bottom-nav-mobile" id="bottomNavMobile"><button class="bn-item" data-ekran="tab-dunya"><span class="bn-icon">🧙</span><span class="bn-label">Parkur</span></button>

<button class="bn-item" data-ekran="tab-profil"><span class="bn-icon">🧍</span><span class="bn-label">Profil</span></button></div><script>
window.dmPreviewFixtures=true;window.aktifOgrenciAdi='Örnek Öğrenci';window.apiURL='/preview';window.yoToast=m=>document.getElementById('fixture-toast').textContent=m;window.maTakip=new Set(['Ayşe','Emir']);window.maVitrinHtml=()=>`<div class="sahne"><h3>Ayşe</h3><div class="takip-satir"><button class="takip-btn" onclick="maTakipDegistir('Ayşe',this)">Takip ediliyor</button></div></div>`;window.maCiz=()=>{};window.yardimIcerikCiz=()=>{};
let blocked=false;window.demoCalls=[];window.fetch=async function(url,opt){const d=opt?.body?JSON.parse(opt.body):{};demoCalls.push(d.islem);let r={ok:true};if(d.islem==='aktifDurum')r={ok:true,serverNow:new Date().toISOString(),liste:(d.isimler||[]).map(ad=>({ad,online:ad==='Ayşe',seenAt:ad==='Ayşe'?new Date().toISOString():null}))};if(d.islem==='takipDavetListesi')r={ok:true,serverNow:new Date().toISOString(),liste:[{ad:'Ayşe',online:true,seenAt:new Date().toISOString()},{ad:'Emir',online:false,seenAt:null}]};if(d.islem==='sosyalDurum')r={ok:true,blocked,mine:blocked};if(d.islem==='ogrenciEngelle')blocked=true;if(d.islem==='ogrenciEngelKaldir')blocked=false;if(d.islem==='oyunEslesmeOlustur')r={ok:true,id:'ornek'};if(d.islem==='oyunEslesmeDurum')r={ok:true,id:'ornek',game:'ucus',mode:'live',status:'waiting',opponent:'Ayşe',ready:false,opponentReady:false,start:null};if(d.islem==='bildirimlerim')r={ok:true,liste:[]};return new Response(JSON.stringify(r));};
function showDemo(v){document.getElementById('tab-aktiviteler').style.setProperty('display',v==='activity'?'block':'none','important');document.getElementById('tab-meduakis').style.display=v==='profile'?'block':'none';document.getElementById('fixture-tabs').hidden=v!=='tabs';if(v==='profile')document.getElementById('maDemoProfile').innerHTML=maVitrinHtml('Ayşe',false);}
</script><script src="activity-preview-parkur.js?v=1"></script><script src="activity-preview-social.js?v=1"></script><script src="activity-ui.js?v=1"></script><script>document.getElementById('fixture-tabs').innerHTML=dmParkurBaslik({energy:30,max:30,gold:1000});document.querySelectorAll('#bottomNavMobile button').forEach(b=>b.removeAttribute('onclick'));</script><div id="fixture-toast" role="status"></div></body></html>
