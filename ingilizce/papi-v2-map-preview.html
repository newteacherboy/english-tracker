<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>DijiMedu | Papi V2 80 Bölüm Haritası</title><style>
*{box-sizing:border-box}:root{font-family:system-ui,Arial,sans-serif;color:#173c32;background:#eaf7ef}body{margin:0;padding:12px}main{max-width:860px;margin:auto}header{background:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px #174b2920}header img{width:70px;height:78px;object-fit:contain}h1{font-size:1.35rem;margin:0 0 6px}h2{font-size:1.1rem;margin:22px 0 10px}.muted{color:#527369;font-size:.9rem}#notice{padding:13px 15px;background:#fff9e8;border:1px solid #edd89a;border-radius:14px;margin:16px 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}nav button{border:1px solid #aad3b7;border-radius:14px;padding:10px 20px;background:white;color:#24513d;font-weight:700;cursor:pointer}nav button[aria-pressed=true]{background:#24794c;color:white}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{border:2px solid #d0e5d2;background:white;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:180px}.card small{color:#557466}.card h3{font-size:1rem;margin:0}.pill{border-radius:50px;background:#ecf4e9;padding:5px 10px;align-self:flex-start;font-size:.78rem}.card a{display:block;margin-top:auto;text-align:center;border-radius:12px;background:#2a875b;color:white;text-decoration:none;padding:11px;font-weight:700}.card a[aria-disabled=true]{background:#e5e9e6;color:#506b5d;pointer-events:none}.legacy{border-color:#efdcb0}#status{margin:15px 0}a:focus-visible,button:focus-visible{outline:3px solid #164b36;outline-offset:2px}@media(max-width:450px){header{padding:12px}header img{width:52px;height:60px}#cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:10px;min-height:160px}nav button{flex:1}h1{font-size:1.1rem}}@media(prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}</style></head><body><main><header><img src="papi-welcome-v2.png" alt="DijiMedu Papi"><div><h1>Papi'nin 80 Duraklık Yolculuğu</h1><div class="muted">A1 – B2 · Geliştirme haritası</div></div></header><p id="notice"><strong>Önizleme:</strong> Buradaki bölümler öğrencilerin gerçek ilerlemesine, XP'sine veya enerjisine kaydedilmez. Yeni içerikler eğitim denetimi bekliyor.</p><nav aria-label="Dil seviyesini seç"><button data-level="A1" aria-pressed="true">A1</button><button data-level="A2" aria-pressed="false">A2</button><button data-level="B1" aria-pressed="false">B1</button><button data-level="B2" aria-pressed="false">B2</button></nav><div id="status" class="muted" role="status"></div><section id="cards" aria-label="Bölümler"></section></main><script type="module">
import {getOrderedChapterIds,locateChapter,previewUrl} from './papi-v2-route.mjs';
const cards=document.querySelector('#cards'),status=document.querySelector('#status');let roadmap;
async function init(){try{const r=await fetch('../docs/papi-v2-80-roadmap.json');if(!r.ok)throw Error('HTTP '+r.status);roadmap=await r.json();show('A1');document.querySelectorAll('[data-level]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.level)));}catch(e){status.textContent='Bölümler yüklenemedi: '+e.message}}
function show(level){document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.level===level)));cards.replaceChildren();const chapters=roadmap.levels.find(l=>l.cefr===level)?.chapters||[];const byId=new Map(chapters.map(c=>[c.chapterId,c]));status.textContent=level+' · '+chapters.length+' bölüm · Bu ekran önizlemedir';
for(const id of getOrderedChapterIds(level)){const c=byId.get(id);if(!c)continue;const card=document.createElement('article');card.className='card'+(c.legacy?' legacy':'');const pill=document.createElement('span');pill.className='pill';pill.textContent=level+' · '+c.sequence+'. durak';const title=document.createElement('h3');title.textContent=c.title;const caption=document.createElement('small');caption.textContent=c.legacy?'Mevcut bölüm · Canlı sisteme müdahale yok':'Yeni bölüm · Taslak içerik';card.append(pill,title,caption);const link=document.createElement('a');const dest=previewUrl(id);link.textContent=dest?'Etkinlik önizlemesi →':'Mevcut bölüm';link.href=dest||'#';if(!dest){link.setAttribute('aria-disabled','true');link.tabIndex=-1;}card.append(link);cards.append(card);}}
init();
</script></body></html>
