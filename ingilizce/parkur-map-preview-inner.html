<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Macera Haritası</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="bottom-nav.css?v=4"><link rel="stylesheet" href="parkur-map-theme-v1.css?v=1"><style>*{box-sizing:border-box}body{margin:0}#tab-dunya{position:fixed;inset:0}#bzParkur{position:absolute;inset:0}#bottomNavMobile{position:fixed;bottom:0;left:0;right:0;display:flex!important;z-index:20}.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Nunito,system-ui}.dm-preview-result{position:fixed;left:10%;right:10%;top:38%;z-index:50;padding:24px;border:2px solid #dfbe72;background:#fff7df;border-radius:18px;color:#274838;font:800 16px Nunito;text-align:center;box-shadow:0 4px 40px #26332250}#userAvatarLetter{display:none}</style></head><body class="dm-parkur-open"><span id="userAvatarLetter">👦</span><div id="tab-dunya" class="active bz-yeni"><div id="bzParkur"></div></div><div class="bottom-nav-mobile" id="bottomNavMobile"></div><script>window.DijiProgressRules={progress:()=>({level:5,ratio:.25})};window.dmProgressPanel={open:()=>notice('Seviye bilgileri')};window.profilAc=()=>notice('Profil');window.dijiEnerjiPaneliAc=()=>notice('Enerji bilgileri');window.magazaAc=()=>notice('Mağaza');window.dmMeduProAc=()=>notice('MeduPro');function notice(s){document.querySelector('.dm-preview-result')?.remove();let n=document.createElement('div');n.className='dm-preview-result';n.setAttribute('role','dialog');n.innerHTML=s+'<br><button onclick="this.parentElement.remove()">Kapat</button>';document.body.append(n)}</script><script src="parkur-map-theme-v1.js?v=1"></script><script>
const steps=[];[16,20,16,16].forEach((n,b)=>{for(let d=0;d<n;d++)steps.push({b,d,no:steps.length+1,done:steps.length<10,available:b===0&&d<=10})});
document.getElementById('bzParkur').innerHTML='<div class="bz-ic">'+dmParkurBaslik({energy:36,max:30,gold:204})+'<div class="dm-parkur-scroll" id="dmParkurScroll">'+dmParkurSahne({steps,current:10})+'</div></div>';
document.querySelectorAll('.dm-map-stop,.dm-map-continue').forEach(t=>t.onclick=()=>notice(dmParkurDurakAdi(+t.dataset.b,+t.dataset.d)+' · '+t.dataset.b+':'+t.dataset.d));
const labels=['Parkur','Medu Akış','Sana Özel','Aktivite','Ders Çalış','Mağaza','Profil'],pos=['3% 7%','50% 7%','98% 10%','3% 58%','50% 59%','98% 56%','5% 100%'];
document.getElementById('bottomNavMobile').innerHTML=labels.map((l,i)=>'<button class="bn-item '+(i===0?'active':'')+'" onclick="notice(\''+l+'\')"><span class="bn-icon"><span class="dm-nav-art" style="background-position:'+pos[i]+'"></span></span><span class="bn-label">'+l+'</span></button>').join('');
requestAnimationFrame(()=>dmParkurMapMount(document.getElementById('dmParkurScroll')));
</script></body></html>
