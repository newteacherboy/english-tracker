<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Diji-Medu • 3D parkur önizlemesi</title><link rel="stylesheet" href="route-exploration.css?v=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f0f3e9;font:14px system-ui;color:#214943}header{height:96px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:1200px;margin:auto}h1{font-size:19px;margin:0}p{font-size:10px;margin:5px 0 0}select{font:700 12px system-ui;padding:8px;border:1px solid #94afa4;border-radius:10px;background:white;color:#214943}main{height:calc(100dvh - 108px);max-width:1100px;position:relative;margin:0 auto;border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 35px #214e4930}output{position:fixed;bottom:0;background:#fff;color:#23483e;font:11px system-ui;padding:4px 12px;width:100%;text-align:center}@media(max-width:500px){header{padding:8px;height:96px;flex-wrap:wrap}h1{font-size:16px}main{border-radius:18px;margin:0 5px;height:calc(100dvh - 118px)}select{font-size:11px;padding:6px}.rx-top{left:8px;right:8px}.rx-title{font-size:13px}.rx-count{font-size:10px}}
</style><header><div><h1>Diji-Medu · Keşif Parkuru</h1><p>Yayın öncesi deneme · Gerçek altın veya enerji verilmez</p></div><div><select id="theme" aria-label="Harita bölgesi"><option value="school">Macera Bahçesi</option><option value="learning">Keşif Adası</option></select> <select id="gender" aria-label="Örnek profil seçimi"><option value="k">Kız karakter</option><option value="e">Erkek karakter</option><option value="">Seçim yapılmamış</option></select></div></header><main id="world"></main><output id="message">Parmağınla sürükle veya ok tuşlarını kullan. Bonuslar yan köşelerde!</output><script type="module">
import {createWorld} from './route-exploration-world.mjs?v=1';
const q=new URLSearchParams(location.search),theme=document.querySelector('#theme'),gender=document.querySelector('#gender');theme.value=q.get('theme')||'school';gender.value=q.get('gender')??'k';let active;
const claims={school:new Set(),learning:new Set()};
function build(){active?.dispose();const learn=theme.value==='learning';const steps=Array.from({length:12},(_,i)=>({id:1000+i,no:210100+i,b:0,d:i,done:i<7,available:i<=7,title:(i+1)+'. Durak'}));
 active=createWorld(document.querySelector('#world'),{steps,current:7,learn,character:{cins:gender.value,s:{ten:'1'}},hasRewards:true,launch:i=>document.querySelector('#message').textContent=(i+1)+'. bölüm seçildi. Gerçek uygulamada kendi dersin açılacak.',request:async(action,id)=>{const c=claims[theme.value];if(action==='claim'){const duplicate=c.has(id);c.add(id);return {ok:true,duplicate,gold:id<3&&!duplicate?2:0,energyAdded:id===3&&!duplicate?1:0};}return {ok:true,claims:[...c]};}});window.previewWorld=active;}
theme.onchange=build;gender.onchange=()=>active.setCharacter({cins:gender.value,s:{ten:'1'}});build();
</script></html>
