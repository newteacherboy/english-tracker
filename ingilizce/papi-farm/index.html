<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eff8e9"><title>Papi Farm · Diji-Medu</title><link rel="stylesheet" href="farm.css"></head><body>
<div class="app">
<header class="top"><div class="brand"><div class="brand-icon"><svg viewBox="0 0 40 40"><path d="M13 30C8 26 8 19 14 16c-1-7 6-12 11-9 7 2 8 11 2 15-1 5-6 10-14 8Z" fill="#f36b54"/><path d="M15 22c-4-1-8 0-10 4 5 3 9 2 12-1" fill="#3e87b8"/><path d="M29 12l7 3-7 4z" fill="#edbb63"/><circle cx="24" cy="12" r="2.5" fill="#243d36"/><path d="M15 31l-2 4m7-4 1 4" stroke="#d29f50" stroke-width="3" stroke-linecap="round"/></svg></div><div><span class="overline">DIJI-MEDU • LEARN IN NATURE</span><h1>Papi Farm</h1></div></div><div class="wallet"><div class="wallet-pill"><span class="coin-icon">✦</span><strong id="coins">120</strong><small>Farm coins</small></div><button class="icon-button" id="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m9 3-.6 2.8-2 .9-2.5-.9-2 3.4 2.1 1.9v2l-2.1 1.9 2 3.4 2.5-.9 2 .9L9 21h4l.6-2.8 2-.9 2.5.9 2-3.4-2.1-1.9v-2l2.1-1.9-2-3.4-2.5.9-2-.9L13 3Z"/></svg></button></div></header>
<main class="game">
<div class="game-head"><div class="level"><span class="level-badge" id="level">1</span><div><strong id="level-title">New Farmer</strong><small id="xp-text">0 / 80 Farm XP</small><div class="xp-track"><i id="xp-bar"></i></div></div></div><div class="region-info"><span id="region-name">Spring Valley</span><span class="scene-badge" id="graphics-status">Loading farm…</span></div></div>
<div class="farm-stage" id="stage"><img id="fallback" alt="Three-dimensional farm" src="assets/life-farm.webp"><canvas id="farm-canvas" aria-label="Interactive 3D farm"></canvas><div id="structure-layer"></div><div id="extra-beds"></div><div id="animal-layer"></div><div id="animal-markers"></div><div id="build-markers"></div><img id="tool-sprite" alt="" hidden><div id="crop-images"></div><div id="mine-markers"></div><div id="weather" aria-hidden="true"></div><div id="papi-shadow" class="papi-shadow"></div><img id="walking-papi" class="walking-papi" src="assets/papi-0.webp" alt="Papi" hidden><div id="walk-marker" hidden></div><div id="hotspots"></div><div class="view-controls"><button id="rotate-left" aria-label="Rotate left" title="Rotate left">↶</button><button id="rotate-right" aria-label="Rotate right" title="Rotate right">↷</button><button id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button><button id="zoom" aria-label="Zoom in" title="Zoom in">＋</button><button id="camera-reset" aria-label="Center camera" title="Center camera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5m0 8v5h-5M8 21H3v-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></button></div><div class="scene-tip" id="scene-tip">Tap a building site to begin.</div><div class="loading" id="loading"><div class="spinner"></div><strong>Preparing your farm</strong></div></div>
<section class="mission" aria-label="English mission"><div class="mission-top"><span class="mission-icon"><svg viewBox="0 0 24 24"><path d="M4 5h5l3 3 3-3h5v15h-5l-3 2-3-2H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v12M7 10h2M15 10h2" stroke="currentColor" stroke-width="1.5"/></svg></span><div class="mission-copy"><span class="overline">ENGLISH MISSION <span id="task-number">01</span></span><strong id="task-text">Plant three carrots.</strong><span id="task-help" hidden></span></div><button class="listen hint-button" id="hint" aria-label="Show Turkish hint" title="Show Turkish hint">💡</button><button class="listen" id="listen" aria-label="Listen to the mission"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9z"/><path d="M16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="mission-bottom"><div class="mission-progress"><i id="task-bar"></i></div><b id="task-count">0 / 3</b><span id="task-reward">+25 XP</span></div><div id="guide-actions" class="guide-actions" hidden><button id="guide-action" type="button">Build</button><button id="guide-skip" type="button">Skip guide</button></div></section>
</main>
<nav class="dock" aria-label="Farm actions"><button data-mode="plant" class="active"><span class="dock-icon" aria-hidden="true">🌱</span><b>Plant</b></button><button data-mode="water"><span class="dock-icon" aria-hidden="true">💧</span><b>Water</b></button><button data-mode="harvest"><span class="dock-icon" aria-hidden="true">🌾</span><b>Harvest</b></button><button data-mode="swap"><span class="dock-icon" aria-hidden="true">▦</span><b>Move</b></button><button data-panel="inventory"><span class="dock-icon" aria-hidden="true">🧺</span><b>Storage</b></button><button data-panel="market"><span class="dock-icon" aria-hidden="true">🏪</span><b>Market</b></button><button data-panel="animals"><span class="dock-icon" aria-hidden="true">🐔</span><b>Animals</b></button><button data-panel="map"><span class="dock-icon" aria-hidden="true">🗺️</span><b>Map</b></button></nav>
</div>
<div id="toast" role="status" class="toast"></div><div id="modal" class="modal" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-handle"></div><header><div><span class="overline" id="sheet-kicker">FARM</span><h2 id="sheet-title">Choose seed</h2></div><button id="close-sheet" class="icon-button" aria-label="Close">×</button></header><div id="sheet-body"></div></section></div>
<audio id="farm-music" src="assets/farm-music.mp3" loop preload="none"></audio><script src="farm-state.js"></script><script src="farm-path.js"></script><script src="farm-camera.js"></script><script src="farm-renderer.js"></script><script src="farm-ui.js"></script></body></html>
